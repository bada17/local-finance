<style>
  :root{
    --ground:#FFFFFF; --sunk:#F4F6F8; --line:#C9D2DA; --line-soft:#E3E8ED;
    --ink:#11181F; --muted:#5A6672; --faint:#8A97A3;
    --accent:#1F4E79; --alert:#B03A22;

    --body:system-ui,-apple-system,'Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
      --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
      --accent:#7FB3DC; --alert:#E0755C;
    }
  }

    --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
    --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
    --accent:#7FB3DC; --alert:#E0755C;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 var(--body)}
  .wrap{max-width:1100px; margin:0 auto; padding-inline:16px}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--ground); border-bottom:1px solid var(--line);
  }

  .grp{display:flex; gap:4px}
  .grp+.grp{margin-left:10px; padding-left:10px; border-left:1px solid var(--line)}
  button{
    font:13px var(--body); color:var(--muted); background:var(--sunk);
    border:1px solid var(--line); padding:5px 11px; cursor:pointer; white-space:nowrap;
  }
  button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  button:disabled{opacity:.4; cursor:not-allowed}

  h1{font-size:20px; margin:22px 0 2px; font-weight:700}

  .basis{
    margin:14px 0 0; padding:10px 12px; background:var(--sunk);
    border:1px solid var(--line); font-size:12.5px; color:var(--muted);
  }
  .basis b{color:var(--ink)}

  h2{font-size:14px; margin:26px 0 2px; font-weight:700; padding-bottom:5px; border-bottom:2px solid var(--ink)}
  h2 small{font-weight:400; color:var(--muted); font-size:12px; margin-left:8px}
  /* 세입 판 ② — 예산과 결산을 한 칸 안에 나란히 둘 때 쓰는 작은 머리 */
  h3{font-size:13px; margin:16px 0 4px; font-weight:600; color:var(--muted)}
  h3 .yr{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-left:4px}
  .note{color:var(--faint); font-size:12px; margin:6px 0 8px}
  .note code{font-family:var(--mono); font-size:11.5px; background:var(--sunk); padding:1px 5px; margin-right:3px}
  .note button{font-size:12px; padding:3px 9px; margin-left:4px}

  select{
    font:13px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:5px 8px; max-width:210px;
  }
  select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .srch{margin:10px 0 4px}
  .srch.grp{flex-wrap:wrap; row-gap:5px}

    font:14px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:7px 10px; width:min(360px,100%);
  }
  .srch input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .scroll{overflow-x:auto; border:1px solid var(--line)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{padding:6px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap}
  thead th{background:var(--sunk); text-align:right; font-weight:600; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  tbody td:first-child{font-family:var(--body); text-align:left}
  tbody td.yr{font-size:11.5px; color:var(--faint); text-align:center}
  tbody tr:hover{background:var(--sunk)}
  tbody tr:last-child td{border-bottom:0}
  tbody td.nm{white-space:normal; max-width:340px; min-width:210px}
  td.mark{color:var(--alert); font-weight:600}

       border:1px solid var(--line-soft)}

<script>
/* 243곳의 목록만 화면에 박혀 있고, 고른 곳의 데이터는 그때 받아 온다.
   243곳을 다 담으면 2.3MB 라 페이지가 무거워진다. */
const INDEX = __INDEX__;
const 곳맵 = Object.fromEntries(INDEX.곳.map(x => [x.cd, x]));
const 곳캐시 = {};
async function 곳데이터(cd){
  if (!(cd in 곳캐시)) {
    try {
      const r = await fetch(`data/loc/${cd}.json`);
      곳캐시[cd] = r.ok ? await r.json() : null;
    } catch (e) { 곳캐시[cd] = null; }
  }
  return 곳캐시[cd];
}
/* 주소는 #자치단체코드,판,찾을글자 꼴이다 — 보기: #4612000,진행중,박람회
   한 사례를 그대로 건네줄 수 있어야 해서 찾을 글자까지 넣는다 */
function 주소읽기(){
  const [cd, v, q] = decodeURIComponent(location.hash.slice(1)).split(',');
  return {
    cd: 곳맵[cd] ? cd : (곳맵['2600000'] ? '2600000' : INDEX.곳[0].cd),
    판: ['결산', '예산', '세입', '진행중', '계약', '의회'].includes(v) ? v : '결산',
    찾기: q || '',
  };
}
function 주소쓰기(){
  const 뒤 = 판 === '진행중' && 찾기.trim() ? `,진행중,${encodeURIComponent(찾기.trim())}`
           : 판 === '결산' ? '' : `,${판}`;
  history.replaceState(null, '', '#' + 지금곳 + 뒤);
}
const 첫판 = 주소읽기();
let 지금곳 = 첫판.cd;
let 판 = 첫판.판;

const 정식 = {서울:'서울특별시', 부산:'부산광역시', 대구:'대구광역시', 인천:'인천광역시',
  광주:'광주광역시', 대전:'대전광역시', 울산:'울산광역시', 세종:'세종특별자치시',
  경기:'경기도', 강원:'강원특별자치도', 충북:'충청북도', 충남:'충청남도',
  전북:'전북특별자치도', 전남:'전라남도', 경북:'경상북도', 경남:'경상남도', 제주:'제주특별자치도'};
/* 「…으로/…로」 — 받침을 보고 고른다 */
const 로of = s => {
  const c = s.charCodeAt(s.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return '로';
  const j = c % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
};
const 이름of = d => d.진행만 ? d.이름            // 2026년에 바뀐 구역은 온 이름 그대로
  : d.갈래 === '광역' ? (정식[d.시도] || d.이름)
  : (d.이름.startsWith(d.시도) ? d.이름.slice(d.시도.length) : d.이름);

/* 중앙투자심사 표의 곳 표기 — 「전남(여수시)」·「서울(본청)」 */
const 심사키 = d => `${d.시도}(${d.갈래 === '광역' ? '본청' : 이름of(d)})`;
const n0 = v => v == null ? '' : Math.round(v).toLocaleString('ko-KR');
const n1 = v => v == null ? '' : v.toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1});
function 돈(v){
  if (v == null) return '';
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toLocaleString('ko-KR',{maximumFractionDigits:2}) + '조';
  if (a >= 1e8)  return (v/1e8 ).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '억';
  if (a >= 1e4)  return (v/1e4 ).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '만';
  return n0(v);
}

/* 판 가르기 — 결산·실적은 결산 판, 예산 계열은 예산 판 */
const 판of = m => (m.기준 === '결산' || m.기준 === '실적') ? '결산' : '예산';

function table(cols, rows){
  return `<div class="scroll"><table>
    <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

/* 순위·중앙값·최소·최대는 화면에서 뺐다(2026-09-21 사용자 지시) —
   "이런 것은 아직 전혀 필요없어. 지금 해야 하는 건 어떤 것들이 있나".
   데이터에는 그대로 있으니 필요해지면 되살리면 된다. */
/* 「구분」 — API 가 당초·최종을 밝히지 않은 예산 지표는 빈칸 대신 그렇다고 적는다(2026-09-30) */
const 구분말 = 기준 => 기준 === '예산' ? '예산 · 당초/최종 표시 없음'
  : 기준.replace('[', ' ').replace(']', '');
function 지표행(m){
  const 천원 = m.단위 === '천원';
  return `<tr>
    <td>${m.이름}</td>
    <td class="yr">${구분말(m.기준)}</td>
    <td class="yr">${m.연도}</td>
    ${m.비율 == null ? '<td class="dim">—</td>'
      : `<td>${m.비율 > 0 && m.비율 < 1 ? m.비율.toFixed(3) : n1(m.비율)}${천원 ? '' : m.단위}</td>`}
    <td>${천원 ? n0(m.금액) + ' 천원' : 돈(m.금액)}<span class="raw">${n0(m.금액)}</span></td>
  </tr>`;
}

const 축설명 = {
  '규모':       '얼마나 큰 살림인가. 아래 모든 비율의 분모가 되는 수다.',
  '어디서 오나': '제 돈인가 받은 돈인가.',
  '어디에 쓰나': '무엇을 골랐나. 높고 낮음보다 방향을 본다.',
  '새는 곳':     '제대로 쓰나. 비율과 금액을 함께 보고 원자료에서 맥락을 확인한다.',
  '빚':         '감당할 수 있나.'
};

const 판설명 = {
  '결산': d => `<b>결산</b> — 이미 쓰고 나서 확정된 실적이다. 숫자가 다시 바뀌지 않는다.
    ${d.결산연도}년이 최신이고 ${Number(d.결산연도)+1}년 결산은 아직 안 올라왔다.
    수의계약비율만 계약 <b>실적</b> 기준이다.<br>${세입세출말}`,
  '예산': d => `<b>예산</b> — 아직 쓰기 전의 계획이다. <b>당초</b>는 그 해 처음 짠 것,
    <b>최종</b>은 추경까지 반영된 것. 최종은 추경이 끝나야 나오므로 한 해 늦다 —
    그래서 자립도·자주도는 <b>당초와 최종을 같은 해로 맞춰</b> 나란히 두었다(차이가 그 해 추경의 몫이다).
    ⚠️ 지방재정365는 <b>1차·2차 추경을 구분해 주지 않는다</b> — 「최종」 하나뿐이라 몇 차 추경인지는 알 수 없다.<br>${세입세출말}`
};
/* 「결산 기준」·「예산 기준」 판이 세출만인지 묻는 말이 있었다(2026-09-30) — 둘 다 담는다고 밝힌다 */
const 세입세출말 = `이 판은 <b>세입과 세출을 함께</b> 담는다 — ① 규모는 둘 다, ② 어디서 오나는 <b>세입</b>,
    ③ 어디에 쓰나·④ 새는 곳은 <b>세출</b>, ⑤ 빚은 둘 다. 세입만 자세히 보려면 「세입」 판, 사업별 세출과 집행은 「세출과 집행」 판.`;

/* ───── 진행 중인 사업 (QWGJK 세부사업별 세출, 일별 누계) ───── */

const 진행캐시 = {};
let 찾기 = 첫판.찾기;
let 보일개수 = 100;
let 재원거르개 = '전부';
let 사업정렬 = '예산';

/* 재원으로 거르기 — 「뭐가 보조금이냐」를 이 칸으로 가른다 */
const 거르개들 = {
  '전부':   () => true,
  '국비':   x => x[국비칸] > 0,
  '시도비': x => x[시도칸] > 0,
  '자체':   x => x[국비칸] === 0 && x[시도칸] === 0,
};
const 정렬들 = {
  '예산': (a, b) => b[예산칸] - a[예산칸],
  '지출': (a, b) => b[지출칸] - a[지출칸],
  '집행률낮은': (a, b) => (집행률(a[지출칸], a[예산칸]) ?? 999) - (집행률(b[지출칸], b[예산칸]) ?? 999),
};
const 정렬이름 = {'예산': '예산현액순', '지출': '지출순', '집행률낮은': '집행률 낮은 순'};

/* 진행 중인 사업은 눌러서(gzip) 담아 두고 화면이 받아서 푼다 —
   243곳이면 36MB 가 11MB 로 준다. 서버가 이미 풀어 준 경우도 있어 앞 두 글자를 보고 가른다 */
async function 진행데이터(cd){
  if (!(cd in 진행캐시)) {
    try {
      const r = await fetch(`data/ongoing/${cd}.json.gz`);
      if (!r.ok) throw new Error(r.status);
      const buf = await r.arrayBuffer();
      const u8 = new Uint8Array(buf);
      let text;
      if (u8[0] === 0x1f && u8[1] === 0x8b) {
        const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        text = await new Response(s).text();
      } else {
        text = new TextDecoder().decode(buf);
      }
      진행캐시[cd] = JSON.parse(text);
    } catch (e) { 진행캐시[cd] = null; }
  }
  return 진행캐시[cd];
}

const 집행률 = (ep, bdg) => bdg ? ep / bdg * 100 : null;

/* 한 사업은 칸 이름 없이 줄줄이 들어 있다 — 차례는 o.열차례 와 같다.
   [이름, 분야, 부문, 회계, 예산현액, 지출, 국비, 시도비, 시군구비, 기타]
   분야·부문·회계는 o.이름표 의 몇 번째인지만 적혀 있다. 243곳이라 이렇게 줄여야 한다. */
const 이름칸 = 0, 분야칸 = 1, 부문칸 = 2, 회계칸 = 3,
      예산칸 = 4, 지출칸 = 5, 국비칸 = 6, 시도칸 = 7, 시군구칸 = 8, 기타칸 = 9;

function 사업행(x, 표){
  const rt = 집행률(x[지출칸], x[예산칸]);
  const 부문 = 표.부문[x[부문칸]];
  const 돈칸 = i => x[i] ? 돈(x[i]) : '<span class="dim">—</span>';
  return `<tr>
    <td class="nm">${x[이름칸]}</td>
    <td class="dim">${표.분야[x[분야칸]]}${부문 ? ' · ' + 부문 : ''}</td>
    <td class="dim">${표.회계[x[회계칸]]}</td>
    <td>${돈(x[예산칸])}<span class="raw">${n0(x[예산칸])}</span></td>
    <td>${돈(x[지출칸])}<span class="raw">${n0(x[지출칸])}</span></td>
    <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
    <td>${돈칸(국비칸)}</td>
    <td>${돈칸(시도칸)}</td>
    <td>${돈칸(시군구칸)}</td>
    <td>${돈칸(기타칸)}</td>
  </tr>`;
}

function 진행표(o){
  const q = 찾기.trim();
  const 거르기 = 거르개들[재원거르개];
  let 걸린 = o.사업.filter(x => (!q || x[이름칸].includes(q)) && 거르기(x));
  if (사업정렬 !== '예산') 걸린 = [...걸린].sort(정렬들[사업정렬]);
  const 합 = i => 걸린.reduce((s, x) => s + x[i], 0);
  const [bdg, ep, gb, sd, sgg, etc] =
    [예산칸, 지출칸, 국비칸, 시도칸, 시군구칸, 기타칸].map(합);
  const rt = 집행률(ep, bdg);

  const 꾸밈 = [q ? `「${q}」` : '', 재원거르개 === '전부' ? '' :
    ({'국비': '국비가 든 것', '시도비': '시도비가 든 것', '자체': '국비·시도비 없이 제 돈으로만'}[재원거르개])]
    .filter(Boolean).join(' · ');

  const 요약 = `<p class="basis">
    ${꾸밈 ? `<b>${꾸밈}</b> — 걸린 사업 <b>${n0(걸린.length)}</b>개`
           : `<b>${o.연도}년 사업 전부</b> <b>${n0(걸린.length)}</b>개`}
    — 예산현액 <b>${돈(bdg)}</b> · 지출 <b>${돈(ep)}</b>${rt == null ? '' : ` (${n1(rt)}%)`}<br>
    재원 — 국비 <b>${돈(gb)}</b> · 시도비 <b>${돈(sd)}</b> · 시군구비 <b>${돈(sgg)}</b> · 기타 <b>${돈(etc)}</b>
    <span class="dim">(재원은 편성 기준이다. 지출액에는 재원 구분이 붙어 오지 않는다)</span>
  </p>`;

  if (!걸린.length) return 요약 + '<p class="note">걸린 사업이 없다. 글자를 줄여 보라.</p>';

  /* 분야별로 묶어 한 눈에 — 찾는 글자가 없을 때만. 「지금 어디에 쓰고 있나」다 */
  let 분야칸들 = '';
  if (!q && 걸린.length > 30) {
    const 묶 = {};
    걸린.forEach(x => {
      const k = x[분야칸];
      (묶[k] ||= {n: 0, bdg: 0, ep: 0, gb: 0});
      묶[k].n++; 묶[k].bdg += x[예산칸]; 묶[k].ep += x[지출칸]; 묶[k].gb += x[국비칸];
    });
    const 줄 = Object.entries(묶).sort((a, b) => b[1].bdg - a[1].bdg).map(([k, v]) => {
      const rt = 집행률(v.ep, v.bdg);
      return `<tr>
        <td>${o.이름표.분야[k] || '—'}</td>
        <td>${n0(v.n)}</td>
        <td>${돈(v.bdg)}</td>
        <td>${돈(v.ep)}</td>
        <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
        <td>${n1(v.bdg / bdg * 100)}%</td>
        <td>${v.gb ? 돈(v.gb) : '<span class="dim">—</span>'}</td>
      </tr>`;
    });
    분야칸들 = `<h2>분야별<small>지금 어디에 쓰고 있나. 아래 사업들을 분야로 묶은 것이다</small></h2>`
      + table(['분야', '사업수', '예산현액', '지출(누계)', '집행률', '몫', '국비'], 줄);
  }

  const 보임 = 걸린.slice(0, 보일개수);
  const 더 = 걸린.length > 보임.length
    ? `<p class="note">${정렬이름[사업정렬]}으로 ${n0(보임.length)}개만 보인다.
       <button id="more" aria-selected="false">${n0(Math.min(500, 걸린.length - 보임.length))}개 더 보기</button></p>`
    : '';

  return 요약 + 분야칸들
    + (분야칸들 ? `<h2>사업별<small>큰 것부터</small></h2>` : '')
    + table(['세부사업', '분야 · 부문', '회계', '예산현액', '지출(누계)', '집행률', '국비', '시도비', '시군구비', '기타'],
            보임.map(x => 사업행(x, o.이름표))) + 더;
}

function 진행칠하기(o){
  document.getElementById('ongoing').innerHTML = 진행표(o);
  const more = document.getElementById('more');
  if (more) more.onclick = () => { 보일개수 += 500; 진행칠하기(o); };
}

async function renderOngoing(cd, d){
  const app = document.getElementById('app');
  app.innerHTML = `<h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
    <p class="note">세출과 집행 자료를 받아 오는 중…</p>`;
  맞추기();

  const o = await 진행데이터(cd);
  if (판 !== '진행중' || cd !== 지금곳) return; // 늦게 온 옛 지역 응답으로 현재 화면을 덮지 않는다
  if (!o) {
    const 뒤 = (바뀜[cd] || []).map(c =>
      `<button data-go="${c}">${곳맵[c]?.이름 || c}${로of(곳맵[c]?.이름 || c)} 가기</button>`).join(' ');
    app.innerHTML = `<h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
      <p class="basis">${뒤
        ? `이 자치단체는 <b>2026년에 구역이 바뀌었다.</b> 결산·예산 지표는 옛 구역 기준으로 남아 있지만,
           세출과 집행 자료는 <b>새 이름으로</b> 올라온다.<br>${뒤}`
        : `이 자치단체의 <b>세출과 집행</b> 자료가 아직 없다.
           지방재정365는 단체마다 올리는 시점이 다르다.`}</p>`;
    app.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => {
      지금곳 = b.dataset.go; 곳맞추기(지금곳); 주소쓰기(); render();
    });
    return;
  }

  const 기준 = `${o.기준.slice(0, 4)}년 ${Number(o.기준.slice(4, 6))}월`;
  app.innerHTML = `
    <h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
    <p class="meta">
      <span>${d.갈래}자치단체</span>
      <span>사업 <b>${n0(o.사업수)}</b>개</span>
      <span>예산현액 <b>${돈(o.예산현액)}</b></span>
      <span>지출 <b>${돈(o.지출)}</b> (${n1(집행률(o.지출, o.예산현액))}%)</span>
      <span>기준 <b>${기준}</b></span>

      <p>⚠️ 원본에 <b>자릿수 오류</b>가 있다. 한 건이 1조원을 넘는 세 줄(임실군 708조 등)은 빼고 셌다.
         금액 칸이 비어 0으로 들어온 계약도 ${n0(c.범위.금액없음)}건 있다(3년치 전국).</p>
      <p>⚠️ <b>같은 계약원부번호가 여러 줄로 오는 것</b>이 전국 1.0% 있다. 서울 중랑천 보행교량은

         위 표의 「같은 계약번호가 두 줄 이상」 칸이 그 몫이다.</p>
      <p>⚠️ <b>계약과 사업을 잇는 열쇠가 없다.</b> 계약명만 있고 세부사업코드가 없어서,
         「이 계약이 어느 사업 것인가」는 이름을 맞춰 보는 수밖에 없다 — 여수시 109건으로 재 보니
         제대로 걸리는 것이 2%뿐이라 <b>자동으로 잇지 않기로 했다.</b></p>
      <p>⚠️ <b>결산 판의 「수의계약비율」과 숫자가 다르다.</b> 그쪽은 지방재정365가 주는 실적 지표고,

         여러 해짜리 계약이 많은 곳은 크게 벌어진다 — 인천미추홀구가 46.6% 대 70.9%다.

function 맞추기(){
  const 진행만 = !!곳맵[지금곳]?.진행만;
  document.querySelectorAll('#view button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.v === 판));
    b.disabled = 진행만 && !['진행중', '계약'].includes(b.dataset.v);
  });
  /* 의회는 맨 위 메뉴 「지방의회」다 — 같은 화면을 쓰되 재정 판 단추를 감추고, 고른 곳은 서로 넘겨 준다 */
  const 의회 = 판 === '의회';
  document.getElementById('view').style.display = 의회 ? 'none' : '';
  const [재정, 의회링크] = ['nav-finance', 'nav-council'].map(id => document.getElementById(id));
  재정.href = '#' + 지금곳; 의회링크.href = `#${지금곳},의회`;
  (의회 ? 재정 : 의회링크).removeAttribute('aria-current');
  (의회 ? 의회링크 : 재정).setAttribute('aria-current', 'page');
  document.title = `살림을 보는 시민 — ${의회 ? '지방의회' : '자치단체별 지방재정'}`;
}

/* ───── 세입 판 — 돈이 어디서 오나 (data/revenue/<코드>.json) ─────
   쓰는 쪽만 보다가 들어오는 쪽을 폈다. 다섯 칸으로 짠다:
   ① 얼마가 ② 어디서 ③ 걷힌 것과 밀린 것 ④ 깎아 준 돈 ⑤ 상과 벌.
   ⭐ ⑤ 가 머리기사다 — 교부세 감액에는 **감액사유와 위반지출내역이 글로** 들어 있다. */
const 세입캐시 = {};
let 세입색인 = null;

async function 세입자료(cd){
  if (세입캐시[cd] !== undefined) return 세입캐시[cd];
  try {
    const r = await fetch(`data/revenue/${cd}.json`);
    세입캐시[cd] = r.ok ? await r.json() : null;
  } catch { 세입캐시[cd] = null; }
  return 세입캐시[cd];
}

async function 세입가운데(){
  if (세입색인) return 세입색인;
  try {
    const r = await fetch('data/revenue/index.json');
    세입색인 = r.ok ? await r.json() : {가운데:{}, 전국:{}};
  } catch { 세입색인 = {가운데:{}, 전국:{}}; }
  return 세입색인;
}

function 세입표(제목, 설명, 속){
  return `<h2>${제목}<small>${설명}</small></h2>${속}`;
}

  if (판 !== '세입' || cd !== 지금곳) return;
  if (!d) {
    app.innerHTML = `<h1>${이름of(곳맵[cd] || {이름: cd})}</h1>

  }
  const 가 = 색인.가운데 || {};

  const 해들 = [...new Set([...결.slice(-5), ...예.slice(-5)].map(x => x.해))].sort();
  const 해값 = (목, 해) => 목.find(x => x.해 === 해)?.총계 ?? null;
  const 규모그림 = 해들.length ? Chart.자리('선', {해: 해들, 단위: '원', 제목: '세입 결산·예산',
    계열: [{이름: '세입 예산', 값: 해들.map(h => 해값(예, h)), 색: 2}, {이름: '세입 결산', 값: 해들.map(h => 해값(결, h)), 색: 1}]}) : '';
  const 규모 = 규모그림 + 접기(table(['구분','연도','총계','일반회계','특별회계·기금'], [
    끝결 ? `<tr><td>세입 결산</td><td class="yr">${끝결.해}</td>
      <td>${돈(끝결.총계)}<span class="raw">${n0(끝결.총계)}</span></td>
      <td>${돈(끝결.일반회계)}</td>
      <td>${돈((끝결.공기업특별||0)+(끝결.기타특별||0)+(끝결.기금||0))}</td></tr>` : '',
    끝예 ? `<tr><td>세입 예산</td><td class="yr">${끝예.해}</td>
      <td>${돈(끝예.총계)}<span class="raw">${n0(끝예.총계)}</span></td>
      <td>${돈(끝예.일반회계)}</td>
      <td>${돈((끝예.공기업특별||0)+(끝예.기타특별||0)+(끝예.기금||0))}</td></tr>` : '',
  ].filter(Boolean)))
    + `<p class="basis">예산은 <b>최종</b>(추경 반영) 기준이라 결산보다 해가 앞선다. 같은 해의 두 선 사이가 <b>잡은 것과 들어온 것의 차이</b>다.</p>`;

  /* ② 어디서 오나 — 예산(잡은 것)과 결산(들어온 것)을 나란히 */
  const 예재 = d.재원예산;
  const 한덩이 = (묶, 무엇) => 묶 ? `
    <h3>${무엇} <span class="yr">${묶.해}년</span></h3>
    ${Chart.자리('쌓기', {칸: 재원차례(묶.칸), 색: 재원색})}
    ${접기(table(['재원','금액','몫'], 묶.칸.map(x =>
      `<tr><td>${x.이름}${x.밖에서 === false
          ? ' <b title="밖에서 새로 들어온 돈이 아니다">※</b>' : ''}</td>
       <td>${돈(x.금액)}<span class="raw">${n0(x.금액)}</span></td>
       <td>${n1(x.몫)}%</td></tr>`)))}` : `<h3>${무엇}</h3><p class="basis">자료가 없다.</p>`;
  const 구성 = `${한덩이(예재, '예산 — 들어올 것으로 잡은 것')}
    ${한덩이(재, '결산 — 실제로 들어온 것')}
    <p class="basis"><b>예산은 추정이고 결산은 실적이다.</b> 둘을 섞지 않고 나란히 두었다.
      ${재 && 예재 ? `제 돈(지방세+세외수입) 몫이 예산 ${예재.해}년 <b>${n1(예재.제돈몫)}%</b>,
        결산 ${재.해}년 <b>${n1(재.제돈몫)}%</b>다.` : ''}

      나머지는 위에서 내려온 돈이라 쓸 곳을 스스로 정하기 어렵다.

    ${재 && 재.안것몫 ? `<p class="basis">※ <b>「보전수입등및내부거래」는 밖에서 새로 들어온 돈이 아니다.</b>
      작년에 쓰고 남은 돈(순세계잉여금)과 회계끼리 주고받은 돈이다.
      이 곳은 그것이 <b>${n1(재.안것몫)}%</b>(${돈(재.안것)})를 차지한다 —
      그것을 빼고 <b>밖에서 들어온 돈만</b>으로 다시 세면 제 돈 몫은
      ${n1(재.제돈몫)}% 가 아니라 <b>${n1(재.제돈몫_밖에서만)}%</b>다.</p>` : ''}
    <p class="note">⛔ <b>총계 기준이다. 순계로 바꾸지 않는다.</b> 순계는 「제 돈으로 조달한 것」이
      아니라 <b>전국 합계를 두 번 세지 않으려고 받는 쪽에서 위에서 내려준 돈을 지운 것</b>이다 —

      제 돈 몫이 15.3%에서 51.3%로 「뛴다」. 자립도가 높아진 게 아니라 분모를 지운 것이다.</p>`;

  /* ③ 무슨 세금인가 — 세목별 */
  const 세 = d.세목;
  const 원 = v => 세?.천원단위 ? (v == null ? v : v * 1000) : v;
  const 세금 = 세 ? `${Chart.자리('막대', {단위: '원', 줄: 세.칸.map(x => ({이름: x.이름.replace('·', ' · '), v: 원(x.금액), 꼬리: n1(x.몫) + '%'}))})}
    ${접기(table(['세목','징수액','몫'], 세.칸.map(x =>
      `<tr><td>${x.이름.replace('·', ' · ')}</td>
       <td>${돈(원(x.금액))}<span class="raw">${n0(원(x.금액))}</span></td>

      ${세.이곳것아님

           <b>${세.단위}</b>의 것이지 이 곳의 몫이 아니다.`
        : `<b>이 자치단체가 실제로 걷은 세금</b>이다.

  /* ③ 걷힌 것과 밀린 것 */

    ${접기(table(['연도','체납 누계','지방세 체납','세외수입 체납','지방세 징수액 대비'],

    : '<p class="basis">체납 자료가 없다.</p>';

  /* ④ 깎아 준 돈 */
  const 깎음 = 면 ? `${Chart.자리('기둥', {단위: '%', 제목: '비과세·감면율',

  /* ⑤ 상과 벌 — 머리기사 */
  const 벌 = d.감액 || [];
  // 깎인 적 없는 해도 칸을 둔다(0) — 빠뜨리면 해 간격이 들쭉날쭉해 보인다

/* ───── 그래프 — site/data/dash.json(243곳 전국 표, build_dashboard.py) 을 한 번 받아 돌려 쓴다 ───── */
let 전국캐시;
async function 전국표(){
  if (전국캐시 !== undefined) return 전국캐시;
  try {
    const D = await (await fetch('data/dash.json')).json();
    const 곳 = D.곳.map(([cd, 이름, 시도, 갈래, 인구], i) => ({i, cd, 이름, 시도, 갈래, 인구}));
    const 번 = Object.fromEntries(곳.map(p => [p.cd, p]));
    const 이름표 = {광역: '광역자치단체', 시: '시', 군: '군', 구: '자치구'};
    전국캐시 = {D, 곳, 번, 지표: Object.fromEntries(D.지표.map(m => [m.이름, m])),
      무리: cd => { const me = 번[cd]; if (!me) return null;
        return {me, 이름: 이름표[me.갈래] || me.갈래, 곳: 곳.filter(p => p.갈래 === me.갈래)}; }};
  } catch (e) { 전국캐시 = null; }
  return 전국캐시;
}
const 짧은이름 = p => p.갈래 === '광역' ? (정식[p.시도] || p.시도) : `${p.시도} ${p.이름.startsWith(p.시도) ? p.이름.slice(p.시도.length) : p.이름}`;

function 지표줄(m, 무리){
  const 표 = 전국캐시.지표[m.이름];
  /* ① 규모는 비율이 아니라 금액으로(2026-09-30) — 1인당 두 지표는 총액(천원 → 원)을 앞에, 1인당은 작은 글씨로 */
  const 규모금액 = m.축 === '규모' && 표.단위 === '천원';
  const 단위 = 규모금액 ? '원' : 표.단위;
  const 이름 = 규모금액 ? ({'1인당 세출예산액': '세출예산(일반회계)', '1인당 지방세부담액': '지방세 예산'}[m.이름] || m.이름) : m.이름;
  const 값of = p => 규모금액 ? (표.금액[p.i] == null ? null : 표.금액[p.i] * 1000)
    : 표.단위 === '원' || 표.비율[p.i] == null ? 표.금액[p.i] : 표.비율[p.i];
  const vs = 무리.곳.map(p => ({cd: p.cd, 이름: 짧은이름(p), v: 값of(p)}));
  const 숫 = vs.map(x => x.v).filter(v => v > 0);
  const 로그 = 단위 === '원' && 숫.length > 1 && Math.max(...숫) / Math.min(...숫) > 30;
  const 내 = 값of(무리.me);
  const 위 = 내 == null ? null : vs.filter(x => x.v != null && x.v > 내).length + 1;
  const 셈 = vs.filter(x => x.v != null).length;
  const 금액 = 규모금액 ? ` · 주민 1인당 ${n0(m.비율)}천원` : 표.단위 === '%' && m.금액 != null ? ` · ${Chart.돈(m.금액)}원` : '';
  return `<div class="ch-row"><div class="nm">${이름}
      <b class="big">${Chart.값글(내, 단위)}</b>
      <small>${구분말(m.기준)} ${m.연도}${금액}${위 ? ` · 큰 쪽에서 ${위}번째 / ${셈}곳` : ''}${로그 ? ' · 로그 눈금' : ''}</small></div>
    ${Chart.자리('점띠', {값: vs, 나: 무리.me.cd, 단위, 로그, 제목: 이름,
      누르면: c => { 지금곳 = c; 곳맞추기(c); 주소쓰기(); render(); scrollTo(0, 0); }})}</div>`;
}

const clikCache = new Map();
/* 전문을 사람이 원문·집행 자료와 대조한 메모. 확인 못 한 것은 '확인 안 됨'으로 싣는다. */
const clikNotes = fetch('data/clik_notes.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
const clikNotesHtml = notes => notes.map(n=>`<div class="clik-note"><h3>의회 기록에서 따라가 볼 것 · ${clikEsc(n.제목)}</h3><ul>${
  n.줄.map(x=>`<li><span class="clik-tag${x.상태==='확인'?'':' unsure'}">${clikEsc(x.상태)}</span> ${clikEsc(x.글)}${
    (x.근거||[]).map(([t,u])=>` <a href="${clikEsc(u)}" target="_blank" rel="noopener noreferrer">${clikEsc(t)} ↗</a>`).join('')}</li>`).join('')
}</ul><p class="note">${clikEsc(n.확인한날)} 기준 사람이 확인한 내용입니다. 위법·낭비를 판단한 것이 아닙니다.</p></div>`).join('');
let clikFilter = {cd:'',kind:'회의록',year:'',query:'',result:'',page:0};
let renderSerial = 0;
async function render(){

    const councils = data.의회.map(c=>clikEsc(c.의회명)+(c.지금있나 === false ? ' <span class="clik-tag">옛 의회</span>' : '')).join(' · ');
    panel.innerHTML = `<div class="section-kicker">의정활동 · 국회도서관 CLIK</div>

      <p class="basis">회의록·의안 <b>목록만</b> 싣습니다. 제목을 누르면 CLIK 원문으로 이동합니다.
      검색은 회의명·의안명·제안자 등 <b>목록 안에서만</b> 찾으며, 발언 전문은 검색하지 않습니다.
      목록이 비어 있어도 논의가 없었다는 뜻은 아닙니다. 옛 의회의 기록은 당시 이름으로 남깁니다.</p>
      ${clikNotesHtml(notes)}
      <div class="clik-controls"><div class="clik-tabs" role="group" aria-label="의정활동 자료 종류">
      ${['회의록','의안'].map(k=>`<button type="button" data-clik-kind="${k}" aria-pressed="${clikFilter.kind===k}">${k} <span>${n0(data[k].length)}</span></button>`).join('')}</div>
      <label>목록에서 찾기<input id="clik-query" type="search" placeholder="회의명·의안명·제안자" value="${clikEsc(clikFilter.query)}"></label>
      <label>날짜<select id="clik-year" aria-label="의정활동 연도"></select></label>
      <label>의안 처리결과<select id="clik-result"><option value="">모든 처리결과</option>
      ${[...new Set(data.의안.map(r=>r.처리묶음))].sort().map(s=>`<option>${clikEsc(s)}</option>`).join('')}</select></label></div>

function drawClik(panel,data){
  const {kind,year,query,result}=clikFilter, minutes=kind==='회의록';
  const q=query.trim().replace(/\s+/g,'').toLowerCase();
  const rows=data[kind].filter(r=>(!year || (year==='unknown'?!r.날짜:r.날짜.startsWith(year))) &&
    (minutes || !result || r.처리묶음===result) && (!q || Object.values(r).join(' ').replace(/\s+/g,'').toLowerCase().includes(q)));
  const pageCount=Math.ceil(rows.length/25);
  clikFilter.page=Math.max(0,Math.min(clikFilter.page,pageCount-1));
  panel.querySelectorAll('[data-clik-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clikKind===kind)));
  panel.querySelector('#clik-result').disabled=minutes;
  const state=data.수집[kind];
  panel.querySelector('#clik-count').textContent=`${kind} ${n0(rows.length)}건 / 이 지역 수집 ${n0(data[kind].length)}건 · 수집 범위 ${state.기간} · 마지막 수집 ${state.마지막수집}`;
  const councils=Object.fromEntries(data.의회.map(c=>[c.rasmblyId,c.의회명]));
  panel.querySelector('#clik-results').innerHTML=rows.length?`<ol class="clik-list">${rows.slice(clikFilter.page*25,(clikFilter.page+1)*25).map(r=>{
    const title=minutes?`${r.MTGNM || '회의명 미확인'} · 제${r.RASMBLY_SESN || '?'}회${r.MINTS_ODR && r.MINTS_ODR!=='0'?' · '+r.MINTS_ODR+'차':''}`:r.BI_SJ || '의안명 미확인';
    const url=/^CLIKC\d+$/.test(r.DOCID)?'https://clik.nanet.go.kr/potal/search/searchView.do?DOCID='+encodeURIComponent(r.DOCID)+'&collection='+(minutes?'minutes':'bill'):'';
    return `<li><time>${clikEsc(r.날짜 || '날짜 미확인')}</time><div>${url?`<a href="${url}" target="_blank" rel="noopener noreferrer">${clikEsc(title)} <span aria-label="새 창">↗</span></a>`:clikEsc(title)}
      <p>${clikEsc(r.RASMBLY_NM || councils[r.RASMBLY_ID] || r.RASMBLY_ID)}${minutes?'':` · ${clikEsc(r.BI_KND_NM)} · 제안: ${clikEsc(r.PROPSR || '미확인')}`}</p>
      ${minutes?'':`<p>처리결과: <b>${clikEsc(r.처리묶음)}</b> <span>원표기: ${clikEsc(r.CL_STD_NM || '빈 값')}</span></p>`}
      ${r.날짜?'':`<p>날짜 원표기: ${clikEsc(r.MTG_DE || r.ITNC_DE || '빈 값')} — 유효한 날짜로 확인되지 않았습니다.</p>`}</div></li>`;
  }).join('')}</ol>`:'<p class="clik-empty">조건에 맞는 수집 목록이 없습니다. 검색어나 날짜를 바꿔 보세요. 논의가 없었다는 뜻은 아닙니다.</p>';
  panel.querySelector('#clik-page').textContent=pageCount?`${clikFilter.page+1} / ${pageCount}쪽 · 한 쪽 25건`:'0건';
  panel.querySelector('#clik-prev').disabled=clikFilter.page===0;
  panel.querySelector('#clik-next').disabled=clikFilter.page+1>=pageCount;
}
