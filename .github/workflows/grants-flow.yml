# 국고보조 돈길 세 칸(기초 226곳) 굽기 — scripts/build_grants_flow.py (2026-11-09 사용자 「일단 저장하고」)
# 손으로: gh workflow run grants-flow.yml -f year=2024   → data/grants_flow_<해>.json 을 올린다(화면 site/ 는 안 건드림)
# 공시(R2 국고보조/)는 해가 지나도 확정이 이어진다 — 해마다 몇 번 다시 굽는다. 가계부 전국 한 해치는 R2 가계부/ 에 둔다(받기 15분).
name: 국고보조 돈길 굽기
on:
  workflow_dispatch:
    inputs:
      year:
        description: '해 (결산이 나온 해)'
        default: '2024'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      LOFIN_KEY: ${{ secrets.LOFIN_KEY }}
      Y: ${{ inputs.year }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sh scripts/r2_sync.sh down data/national_grants 국고보조
      - name: 가계부(세부사업 세출) 전국
        run: |
          sh scripts/r2_sync.sh down data/raw 가계부 || true
          [ -f "data/raw/QWGJK__exe_ymd-${Y}1231_fyr-${Y}.json" ] || { python scripts/fetch_lofin.py QWGJK fyr=$Y exe_ymd=${Y}1231 | tail -3; sh scripts/r2_sync.sh up data/raw 가계부; }
      - run: python scripts/build_grants_flow.py $Y
      - run: sh scripts/bot_push.sh "국고보조 돈길 굽기 · $Y" data/grants_flow_$Y.json
