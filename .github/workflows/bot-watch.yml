# 봇 지킴이 — 예약이 깃허브에서 빠져도 봇이 쉬지 않게, 한 시간마다 보고 안 돈 봇을 손으로 돌리듯 부른다.
# 2026-11-03 새벽 날마다 수집(5:20)·국회 알림(5:50)·국고보조(3시) 예약이 대기 0·깃허브 정상인데도 아예 안 떴다.
# 평소엔 예약이 3시간쯤 늦게 뜬다 — 그보다 더 늦으면 빠진 것으로 본다.
# 늦게 뜬 예약과 겹쳐도 괜찮다: 날마다 수집은 daily.yml 의 gate 가 건너뛰고(2026-11-06), 국회 알림은 새것만 보낸다.
# 지킴이 예약도 빠질 수 있지만 하루 스물네 번이라 몇 번 빠져도 된다. 정각은 붐벼서 37분.
name: 봇 지킴이

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - run: |
          last() { date -d "$(gh run list -w "$1" -L 1 --json createdAt -q '.[0].createdAt // "1970-01-01T00:00:00Z"')" +%s; }
          busy() { [ -n "$(gh run list -w "$1" -L 5 --json status -q '.[] | select(.status != "completed") | .status')" ]; }
          kick() { echo "▶ $1 — $2"; gh workflow run "$1" --ref main; }
          now=$(date +%s)
          kst5=$(TZ=KST-9 date -d '05:00' +%s)   # 오늘 한국 시간 새벽 5시(시간대 자료 없이도 되는 꼴)

          # 날마다 — 5시 뒤로 한 번도 안 돌았는데 9시 반(국회는 10시)이 지났으면
          if [ $now -gt $((kst5 + 16200)) ] && [ $(last daily.yml) -lt $kst5 ] && ! busy daily.yml; then kick daily.yml '오늘 예약이 안 떴다'; fi
          if [ $now -gt $((kst5 + 18000)) ] && [ $(last assembly.yml) -lt $kst5 ] && ! busy assembly.yml; then kick assembly.yml '오늘 예약이 안 떴다'; fi

          # 날마다 — 오늘 실행이 빨간불이면 한 시간 뒤 실패한 갈래만 다시 돌린다(한 실행에 세 번까지).
          # 2026-11-10 지방재정365 가 낮에 30분쯤 응답이 없어 두 번 다 실패했는데, 위 줄은 「돌긴 돌았다」고 다시 안 불렀다.
          # 통째로 다시 부르지 않고 --failed 로 — 성공한 CLIK 갈래가 하루 한도를 또 쓰지 않게.
          read -r id st cc at up <<EOF
          $(gh run list -w daily.yml -L 1 --json databaseId,status,conclusion,attempt,updatedAt -q '.[0] | "\(.databaseId) \(.status) \(.conclusion) \(.attempt) \(.updatedAt)"')
          EOF
          if [ -n "$id" ] && [ $(last daily.yml) -ge $kst5 ] && [ "$st" = completed ] && [ "$cc" = failure ] && [ "$at" -lt 3 ] && [ $((now - $(date -d "$up" +%s))) -gt 3600 ]; then
            echo "▶ daily.yml — 오늘 실행 $id 실패(시도 $at), 실패한 갈래만 다시"; gh run rerun "$id" --failed
          fi

          # 국고보조 — 남았으면 스스로 이어 부른다(national-grants.yml 끝). 그 고리가 끊기고 주간 예약도 빠졌을 때만
          if [ $((now - $(last national-grants.yml))) -gt 691200 ] && ! busy national-grants.yml; then kick national-grants.yml '8일 넘게 안 돌았다'; fi
          # PC 날마다 수집(지방재정365, 2026-11-11 부터 PC — daily.yml lofin 설명) — PC 는 텔레그램 키가 없어 여기서 본다.
          # 오후 2시가 지나도 오늘 기록(data/pc_daily.json)이 없거나 받기가 실패로 적혀 있으면 알린다(지킴이가 뜰 때마다 — 하루 몇 번)
          if [ $now -gt $((kst5 + 32400)) ]; then
            pc=$(gh api "repos/$GH_REPO/contents/data/pc_daily.json" -q .content 2>/dev/null | base64 -d 2>/dev/null || true)
            # bash 변수 이름은 영어만 된다(한글이면 command not found — 11-11 빨간불)
            pc_day=$(echo "$pc" | jq -r '.["날"] // ""' 2>/dev/null || true)
            pc_bad=$(echo "$pc" | jq -r '[to_entries[] | select((.key | test("받기")) and .value != 0 and .value != true) | .key] | join(",")' 2>/dev/null || true)
            msg=''
            [ "$pc_day" = "$(TZ=KST-9 date +%F)" ] || msg="PC 날마다 수집(지방재정365) 오늘 기록 없음 — 마지막 ${pc_day:-없음}. PC 가 꺼져 있었나?"
            [ -z "$msg" ] && [ -n "$pc_bad" ] && msg="PC 날마다 수집(지방재정365) 실패: $pc_bad — PC %TEMP%\local-finance-daily.log"
            if [ -n "$msg" ]; then
              echo "▶ $msg"
              [ -n "$TELEGRAM_TOKEN" ] && curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=⚠️ local-finance — $msg" || true
            fi
          fi
          # PC 달마다 받기(2026-11-13 부터 PC — monthly.yml 머리 설명) — 1일 오후 2시가 지나도 이번 달 기록(data/pc_monthly.json)이 없거나 받기 실패면
          if [ "$(TZ=KST-9 date +%d)" != 01 ] || [ "$(TZ=KST-9 date +%H)" -ge 14 ]; then
            pm=$(gh api "repos/$GH_REPO/contents/data/pc_monthly.json" -q .content 2>/dev/null | base64 -d 2>/dev/null || true)
            pm_day=$(echo "$pm" | jq -r '.["날"] // ""' 2>/dev/null || true)
            pm_bad=$(echo "$pm" | jq -r '[to_entries[] | select((.key | test("받기|올리기")) and .value != 0) | .key] | join(",")' 2>/dev/null || true)
            msg=''
            [ "${pm_day:0:7}" = "$(TZ=KST-9 date +%Y-%m)" ] || msg="PC 달마다 받기(지방재정365) 이번 달 기록 없음 — 마지막 ${pm_day:-없음}. 달마다 굽기도 안 돌았다"
            [ -z "$msg" ] && [ -n "$pm_bad" ] && msg="PC 달마다 받기(지방재정365) 실패: $pm_bad — PC %TEMP%\local-finance-monthly.log"
            if [ -n "$msg" ]; then
              echo "▶ $msg"
              [ -n "$TELEGRAM_TOKEN" ] && curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=⚠️ local-finance — $msg" || true
            fi
          fi
          echo 끝
