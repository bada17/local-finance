# site/ 를 깃허브 페이지로 올린다.
# main 에 푸시될 때마다, 또는 손으로 돌릴 때.
name: 페이지 올리기

on:
  push:
    branches: [main]
    paths: ['site/**', 'drafts/kiosk/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # 무인 회수기 계약 화면(GPT 시안, 숫자 확정 전) — drafts/kiosk 를 /kiosk/ 로 같이 올린다. 메뉴엔 안 붙임
      - run: mkdir -p site/kiosk && cp drafts/kiosk/{index.html,app.mjs,model.mjs,style.css,data.json,map.json} site/kiosk/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
