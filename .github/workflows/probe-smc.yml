name: 서울시의회 누리집 닿나(한 번)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sS -m 30 -o /dev/null -w "https %{http_code}\n" https://ms.smc.seoul.kr/ || true
          curl -sS -m 30 -o /dev/null -w "http %{http_code}\n" http://ms.smc.seoul.kr/ || true
          curl -sS -m 30 -o /dev/null -w "tls1.2 %{http_code}\n" --tlsv1.2 --tls-max 1.2 https://ms.smc.seoul.kr/ || true
          curl -sS -m 30 -o /dev/null -w "smc-main %{http_code}\n" https://www.smc.seoul.kr/ || true
          curl -sS -m 30 -o /dev/null -w "seoul.go.kr %{http_code}\n" https://www.seoul.go.kr/ || true
