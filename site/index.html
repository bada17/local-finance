<title>우리 동네 재정 성적표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ground:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9;
    --line:#D5DCE3; --line-soft:#E5EAEF;
    --ink:#0F1720; --muted:#5C6A78; --faint:#8695A3;
    --accent:#2C5F8A; --alert:#C4452C; --ok:#2E8B6F;
    --mark:#98A6B4;
    --display:'Gothic A1',system-ui,sans-serif;
    --body:'IBM Plex Sans KR',system-ui,sans-serif;
    --mono:'IBM Plex Mono','IBM Plex Sans KR',monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#10151A; --surface:#171D24; --sunk:#1D242C;
      --line:#2B343E; --line-soft:#222A32;
      --ink:#E9EEF3; --muted:#9AA7B4; --faint:#75838F;
      --accent:#7FB3DC; --alert:#E0674A; --ok:#45B08F;
      --mark:#4A5865;
    }
  }
  :root[data-theme="dark"]{
    --ground:#10151A; --surface:#171D24; --sunk:#1D242C;
    --line:#2B343E; --line-soft:#222A32;
    --ink:#E9EEF3; --muted:#9AA7B4; --faint:#75838F;
    --accent:#7FB3DC; --alert:#E0674A; --ok:#45B08F;
    --mark:#4A5865;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--body); font-size:15px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:0 16px}

  /* ── 머리 ───────────────────────────── */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb,var(--ground) 88%,transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar .wrap{display:flex; align-items:center; gap:12px; min-height:52px; flex-wrap:wrap}
  .brand{
    font-family:var(--display); font-weight:900; font-size:14px;
    letter-spacing:-.01em; margin-right:auto;
  }
  .brand em{font-style:normal; color:var(--accent)}
  .switch{display:flex; gap:2px; background:var(--sunk); padding:3px; border-radius:2px; border:1px solid var(--line-soft)}
  .switch button{
    font:600 12.5px/1 var(--body); color:var(--muted);
    background:none; border:0; padding:7px 12px; cursor:pointer; border-radius:1px;
  }
  .switch button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
  .switch button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  /* ── 표지 ───────────────────────────── */
  header.hero{padding-block:40px 28px}
  .eyebrow{
    font:600 11.5px/1 var(--body); letter-spacing:.14em; color:var(--faint);
    text-transform:uppercase; margin-bottom:14px;
  }
  h1{
    font-family:var(--display); font-weight:900; font-size:clamp(30px,7vw,46px);
    line-height:1.12; letter-spacing:-.025em; margin:0 0 6px; text-wrap:balance;
  }
  .sub{color:var(--muted); font-size:14px; margin:0}
  .sub b{color:var(--ink); font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums}

  .headline{
    margin-top:26px; padding:20px 22px;
    background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--accent);
  }
  .headline p{margin:0; font-size:15.5px; line-height:1.7}
  .headline .big{
    font-family:var(--mono); font-weight:600; font-size:26px;
    color:var(--accent); font-variant-numeric:tabular-nums;
  }

  /* ── 축 ─────────────────────────────── */
  section.axis{margin-top:38px}
  .axis-head{display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap}
  .axis-head h2{
    font-family:var(--display); font-weight:700; font-size:19px;
    letter-spacing:-.015em; margin:0;
  }
  .axis-head .q{font-size:13px; color:var(--muted)}
  .axis-note{font-size:12.5px; color:var(--faint); margin:0 0 14px}

  .rows{background:var(--surface); border:1px solid var(--line)}
  .row{
    display:grid; grid-template-columns:132px 78px 1fr 86px;
    align-items:center; gap:14px;
    padding:13px 18px; border-top:1px solid var(--line-soft);
  }
  .row:first-child{border-top:0}
  .row .name{font-size:13.5px; font-weight:500}
  .row .val{
    font-family:var(--mono); font-weight:600; font-size:15px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .row .val small{font-weight:400; font-size:11px; color:var(--faint); margin-left:2px}
  .rank{
    justify-self:end; text-align:right;
    font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums;
    color:var(--muted); line-height:1.35;
  }
  .rank b{display:block; font-size:13.5px; font-weight:600; color:var(--ink)}
  .row[data-flag="alert"] .rank b{color:var(--alert)}
  .row[data-flag="ok"] .rank b{color:var(--ok)}

  .strip{position:relative; height:30px; width:100%}
  .strip .axisline{position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line)}
  .strip i{position:absolute; display:block}
  .strip .tick{top:9px; width:1px; height:12px; background:var(--mark); opacity:.4}
  .strip .med{top:4px; width:1px; height:22px; background:var(--faint); opacity:.65}
  .strip .me{
    top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 2px var(--surface);
  }
  .row[data-flag="alert"] .me{background:var(--alert)}
  .row[data-flag="ok"] .me{background:var(--ok)}

  /* ── 원문 ───────────────────────────── */
  .docs{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .docs a{
    flex:1 1 200px; display:block; padding:14px 16px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--ink); text-decoration:none;
  }
  .docs a:hover{border-color:var(--accent)}
  .docs a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .docs .t{font-weight:600; font-size:14px; display:block}
  .docs .u{font-size:11px; color:var(--faint); font-family:var(--mono); word-break:break-all; display:block; margin-top:3px}

  /* ── 꼬리 ───────────────────────────── */
  footer{margin-top:46px; padding-block:22px 44px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
  footer p{margin:0 0 7px}
  footer code{font-family:var(--mono); font-size:11.5px; background:var(--sunk); padding:1px 5px; border:1px solid var(--line-soft)}
  .stamp{
    display:inline-block; font:600 10.5px/1 var(--body); letter-spacing:.08em;
    color:var(--faint); border:1px solid var(--line); padding:5px 9px; margin-bottom:14px;
  }

  #tip{
    position:fixed; z-index:40; pointer-events:none; opacity:0; transition:opacity .12s;
    background:var(--ink); color:var(--ground);
    font:500 11.5px/1.5 var(--body); padding:7px 10px; max-width:240px;
    box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  #tip b{font-family:var(--mono); font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  @media (max-width:640px){
    .row{grid-template-columns:1fr 72px; gap:6px 12px; padding:14px 15px}
    .row .name{grid-column:1}
    .row .val{grid-column:2}
    .row .strip-cell{grid-column:1/-1; order:3}
    .rank{grid-column:1/-1; order:4; justify-self:start; text-align:left; display:flex; gap:7px; align-items:baseline}
    .rank b{display:inline}
  }
</style>

</div>

<main class="wrap" id="app"></main>

const UNIT = n => n.includes('1인당') ? '천원' : '%';
const fmt = (v, n) => n.includes('1인당')
  ? v.toLocaleString('ko-KR')
  : (Math.round(v * 10) / 10).toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1});

/* 순위가 위·아래 10% 안이면 깃발을 단다. 색만으로 말하지 않고 순위 숫자를 늘 같이 적는다. */
const FLAGGED = new Set(['새는 곳', '빚']);
function flagOf(m){
  if (!FLAGGED.has(m.축)) return '';
  const edge = Math.max(2, Math.round(m.전체 * 0.1));
  if (m.순위 <= edge) return m.높을수록나쁨 ? 'alert' : 'ok';
  if (m.순위 > m.전체 - edge) return m.높을수록나쁨 ? 'ok' : 'alert';
  return '';
}

function strip(m){
  const lo = m.최소, hi = m.최대, span = (hi - lo) || 1;
  const pct = v => (3 + (v - lo) / span * 94).toFixed(2);
  const ticks = m.분포.map(v => `<i class="tick" style="left:${pct(v)}%"></i>`).join('');
  return `<div class="strip-cell"><div class="strip" role="img"
     aria-label="${m.전체}곳 가운데 ${m.순위}위. 값 ${fmt(m.값,m.이름)}${UNIT(m.이름)}, 중앙값 ${fmt(m.중앙값,m.이름)}${UNIT(m.이름)}">
    <span class="axisline"></span>${ticks}<i class="med" style="left:${pct(m.중앙값)}%"></i><i class="me" style="left:${pct(m.값)}%"></i>
  </div></div>`;
}

    </footer>`;

  document.querySelectorAll('#switch button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.cd === cd)));
}

/* 값 하나하나에 붙는 설명 */
const tip = document.getElementById('tip');
document.addEventListener('pointerover', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const m = JSON.parse(row.dataset.m);
  tip.innerHTML = `${m.n}<br><b>${m.v}${m.u}</b> · ${m.t}곳 중 <b>${m.r}위</b><br>중앙값 ${m.md}${m.u}`;
  tip.style.opacity = '1';
});
document.addEventListener('pointermove', e => {
  if (tip.style.opacity !== '1') return;
  const pad = 14;
  tip.style.left = Math.min(e.clientX + pad, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top  = Math.max(8, e.clientY - tip.offsetHeight - pad) + 'px';
});
document.addEventListener('pointerout', e => {
  if (!e.relatedTarget || !e.relatedTarget.closest?.('.row')) tip.style.opacity = '0';
});

const sw = document.getElementById('switch');
sw.innerHTML = Object.values(DATA).map(d =>
  `<button role="tab" data-cd="${d.laf_cd}" aria-selected="false">${이름of(d)}</button>`).join('');
sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) render(b.dataset.cd); });

render(Object.keys(DATA)[0]);
</script>
