# PC 에서 받은 원자료를 Cloudflare R2 로 올린다 — 키는 깃허브에만 있다(이 PC 엔 없다).
#
# 쓰는 법(2026-10-16): PC 에서 파일을 **임시(draft) 릴리스** `suui-move` 에 붙이고 이 봇을 손으로 돌린다.
#   gh release create suui-move data/수의계약/*.json.gz --draft --title "R2 로 옮길 것(잠깐)" --notes "봇이 옮기고 지운다"
#   gh workflow run r2-move.yml --ref main
# → 내려받아 R2(수의계약/)에 올리고, 다시 내려받아 견준 뒤 **같으면 릴리스를 지운다.** 저장소 기록엔 안 남는다.
# ⚠️ 임시 릴리스라 남에게 안 보인다. 대신 태그가 없어 `--cleanup-tag` 를 붙이면 422 로 빨갛게 끝난다(첫 실행에서 데임).
# 지난 쓰임: 2026-10-01 CLIK 상세(data/clik/상세 → clik/상세)를 저장소에서 옮겼다.
#   그때는 이 파일을 고쳐 푸시하면 돌았는데, 고칠 때마다 빈 폴더를 올리려다 빨갛게 떠서 그 길은 뺐다.
# 2026-11-02 계약 원본 2020~2023(1,461일) — 릴리스 첨부는 1,000개까지라 **해마다 tar 하나로 묶어** `contracts-move` 에 붙인다.
#   봇이 풀어 R2(계약/)에 올린다. 있는 릴리스만 옮기고 없는 건 건너뛴다.
name: R2 로 옮기기

on:
  workflow_dispatch:

permissions:
  contents: write     # 다 옮긴 뒤 릴리스를 지운다

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: 수의계약 사유 올리기
        run: |
          gh release view suui-move > /dev/null 2>&1 || { echo '릴리스 suui-move 없음 — 건너뜀'; exit 0; }
          gh release download suui-move -D data/수의계약
          sh scripts/r2_sync.sh up data/수의계약 수의계약
          # 올라갔는지 — 내려받아 하나씩 견준다
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 수의계약
          for f in data/수의계약/*.json.gz; do cmp "$f" "/tmp/back/$(basename "$f")"; done
          echo '같다 — 다 올라갔다'
          gh release delete suui-move -y
      # 2026-11-09 저장소 다이어트 — 저장소에 있던 큰 자료를 그대로 R2 로. 저장소에서 빼기 전에 한 번 돌린다(빠진 뒤엔 건너뜀).
      - name: 저장소 큰 자료 올리기
        run: |
          [ -n "$(git ls-files data/contracts | head -1)" ] || { echo '저장소에 계약 원본이 없다 — 건너뜀'; exit 0; }
          mkdir -p /tmp/dg && cp data/datagokr_file_list.json.gz data/datagokr_api_list.json.gz /tmp/dg/
          for p in 'data/contracts 최근계약' 'data/bizno 사업자번호' 'data/vendors 조달업체' '/tmp/dg 공공데이터목록'; do
            set -- $p
            sh scripts/r2_sync.sh up "$1" "$2"
            rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back "$2"
            n=0; for f in $(cd "$1" && find . -type f); do cmp "$1/$f" "/tmp/back/$f"; n=$((n + 1)); done   # 사업자번호엔 일/ 아래 하루치가 있다
            echo "$2: $n 개 다 같다"
          done
      # 2026-11-09 보탬e 지방보조금 원본(받은 곳 실명 섞임) — 저장소에서 빼기 전에 한 번(빠진 뒤엔 건너뜀)
      - name: 보탬e 원본 올리기
        run: |
          [ -n "$(git ls-files data/grants | head -1)" ] || { echo '저장소에 보탬e 원본이 없다 — 건너뜀'; exit 0; }
          sh scripts/r2_sync.sh up data/grants 보탬e
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 보탬e
          n=0; for f in data/grants/*.json.gz; do cmp "$f" "/tmp/back/$(basename "$f")"; n=$((n + 1)); done
          echo "보탬e: $n 개 다 같다"
      - name: 계약 원본 올리기
        run: |
          gh release view contracts-move > /dev/null 2>&1 || { echo '릴리스 contracts-move 없음 — 건너뜀'; exit 0; }
          gh release download contracts-move -D /tmp/tar
          mkdir -p data/contracts_old
          for t in /tmp/tar/*.tar; do tar -xf "$t" -C data/contracts_old; done
          sh scripts/r2_sync.sh up data/contracts_old 계약
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 계약
          for f in data/contracts_old/*.json.gz; do cmp "$f" "/tmp/back/$(basename "$f")"; done
          echo '같다 — 다 올라갔다'
          gh release delete contracts-move -y
      # 2026-11-11 지방재정365 가 해외 서버를 막아 날마다 계약 수집을 PC 에서 돌린다(scripts/pc_daily_lofin.ps1).
      #   PC 키는 읽기 전용이라 바뀐 계약 원본을 날마다 임시 릴리스 contracts-pc 에 <날>.tar.gz 로 붙이고 이 봇을 부른다.
      #   전날 것이 남아 있으면 같이 옮긴다(날 순서로 풀어 새것이 이긴다).
      - name: PC 날마다 계약 원본 올리기
        run: |
          gh release view contracts-pc > /dev/null 2>&1 || { echo '릴리스 contracts-pc 없음 — 건너뜀'; exit 0; }
          gh release download contracts-pc -D /tmp/pc
          mkdir -p /tmp/pcc && for t in $(ls /tmp/pc/*.tar.gz | sort); do tar -xzf "$t" -C /tmp/pcc; done
          sh scripts/r2_sync.sh up /tmp/pcc 최근계약
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 최근계약
          for f in /tmp/pcc/*; do cmp "$f" "/tmp/back/$(basename "$f")"; done
          echo "같다 — $(ls /tmp/pcc | wc -l)개 다 올라갔다"
          gh release delete contracts-pc -y
      # 2026-11-11 국고보조 돈길 — 보탬e 2024(받은 곳 실명 섞임)를 「지역 모름」 잇기에 쓴다. 화면용 보탬e/ 와 섞이지 않게 돈길/ 로
      #   gh release create dongil-move data/raw/botem_<해>.json.gz --draft --title "R2 로 옮길 것(잠깐)" --notes "봇이 옮기고 지운다"
      - name: 돈길 원본 올리기
        run: |
          gh release view dongil-move > /dev/null 2>&1 || { echo '릴리스 dongil-move 없음 — 건너뜀'; exit 0; }
          gh release download dongil-move -D /tmp/dongil
          sh scripts/r2_sync.sh up /tmp/dongil 돈길
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 돈길
          for f in /tmp/dongil/*; do cmp "$f" "/tmp/back/$(basename "$f")"; done
          echo "같다 — $(ls /tmp/dongil | wc -l)개 다 올라갔다"
          gh release delete dongil-move -y
