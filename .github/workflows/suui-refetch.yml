# 수의계약 사유 — 2025년 12달을 원자료 전부(원계약·차수 포함, 담당 공무원 연락처만 뺌)로 다시 받는다(2026-10-26 사용자 「받는 봇을 만들어놔」).
# 같은 계약을 고쳐 다시 올린 줄을 거르려면 차수가 있어야 한다(fetch_bizno.py 수의칸 주석). 지난 파일엔 그 칸이 없다.
# 날마다 돌며 「원자료 칸이 없는 달」만 받는다 — 하루 한도(429)에 막히면 받은 갈래는 조각으로 R2 에 남고 다음 날 잇는다.
# 다 차면 「이미 있다」만 찍고 끝난다. 2024·2026 도 채우려면 아래 달 범위를 넓힌다(사용자 「나중에」).
# 새벽 날마다 수집(daily.yml bizno, 05:20)과 같은 키·같은 한도를 쓴다 — 그래서 낮에 돈다.
name: 수의계약 차수 채우기

on:
  schedule:
    - cron: '0 4 * * *'          # 한국 시간 13시
  workflow_dispatch:

concurrency:
  group: suui-refetch
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 내려받기가 안 되면 여기서 멈춘다 — 받은 조각을 모르고 처음부터 받으면 한도를 날린다
      - run: sh scripts/r2_sync.sh down data/수의계약 수의계약
      - id: fetch
        name: 2025년 원자료 없는 달 받기
        timeout-minutes: 170
        continue-on-error: true        # 하루 한도에 막혀 멈추는 건 예상된 일 — 받은 것은 아래에서 올린다
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u scripts/fetch_bizno.py 202501 202512 --사유만 --차수채움 --분 150
      - name: R2 로 올리기
        if: ${{ !cancelled() }}
        run: sh scripts/r2_sync.sh up data/수의계약 수의계약
      - name: 얼마나 찼나
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, 'scripts')
          import fetch_bizno as f, os
          달 = [f'2025{m:02d}' for m in range(1, 13)]
          찬 = [d for d in 달 if f.원자료있나(os.path.join('data', '수의계약', f'{d}.json.gz'))]
          print(f'2025년 원자료 채운 달 {len(찬)}/12 — 남은 달 {sorted(set(달) - set(찬))}')
          EOF
