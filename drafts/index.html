<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문 초안 · 살림을 보는 시민</title>
<!-- ⚠️ 초안. site/ 밖이라 배포되지 않는다. 보려면 저장소 맨 위에서 python -m http.server 8765 → /drafts/
     데이터: drafts/data.json (python scripts/build_drafts.py 가 굽는다). 숫자는 전부 그 파일에서 온다 — 손으로 넣은 숫자 없음.
     화면에 보이는 글에는 긴 줄표를 쓰지 않는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --ground:#F6F6F4; --paper:#FFFFFF; --tint:#EEEEEA; --line:#DCDCD7;
    --ink:#17191C; --muted:#5C6168; --faint:#8C9198;
    --accent:#C2410C; --accent-ink:#FFFFFF; --bar:#A9AEB4;
    --font:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#131415; --paper:#1A1B1D; --tint:#222326; --line:#2F3134;
      --ink:#EDEDEA; --muted:#A3A8AE; --faint:#767B81;
      --accent:#F2845C; --accent-ink:#1A0E08; --bar:#4F5358;
    }
  }
  :root[data-theme="dark"]{
    --ground:#131415; --paper:#1A1B1D; --tint:#222326; --line:#2F3134;
    --ink:#EDEDEA; --muted:#A3A8AE; --faint:#767B81;
    --accent:#F2845C; --accent-ink:#1A0E08; --bar:#4F5358;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--ground); color:var(--ink); font:16px/1.6 var(--font); letter-spacing:-.01em; word-break:keep-all}
  a{color:inherit}
  .wrap{max-width:1180px; margin:0 auto; padding-inline:24px}
  @media (max-width:640px){ .wrap{padding-inline:16px} }

  /* 머리 */
  header{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--line)}
  header .wrap{display:flex; align-items:center; gap:20px; height:64px}
  .mark{font-weight:800; font-size:15px; white-space:nowrap}
  .mark small{font-weight:600; color:var(--accent); margin-left:8px; font-size:12px}
  nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap; text-decoration:none; font-size:14px; font-weight:600; color:var(--muted); padding:8px 12px; border-bottom:2px solid transparent}
  nav a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}
  nav a:hover{color:var(--ink)}
  .pick{display:flex; gap:6px}
  select{font:600 14px var(--font); color:var(--ink); background:var(--paper); border:1px solid var(--line); padding:7px 10px; border-radius:0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  @media (max-width:860px){
    header .wrap{height:auto; flex-wrap:wrap; padding-block:10px; gap:10px}
    nav{order:3; flex-basis:100%}
  }

  /* 한 문 */
  .door{animation:in .35s cubic-bezier(.16,1,.3,1)}
  @keyframes in{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .door{animation:none} }

  .hero{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,1fr); gap:48px; align-items:end; padding:72px 0 56px; border-bottom:1px solid var(--line)}
  .when{display:inline-block; font-size:13px; font-weight:700; color:var(--accent); margin-bottom:18px}
  h1{font-size:clamp(28px,3.6vw,44px); line-height:1.2; letter-spacing:-.035em; font-weight:800; margin:0}
  h1 em{font-style:normal; color:var(--accent)}
  .sub{font-size:18px; color:var(--muted); max-width:34em; margin:22px 0 0}
  .sub b{color:var(--ink)}
  .big{border-left:3px solid var(--accent); padding-left:22px}
  .big .n{font-size:clamp(40px,4.6vw,64px); font-weight:800; letter-spacing:-.045em; line-height:1}
  .big .l{font-size:15px; font-weight:700; margin-top:10px}
  .big .s{font-size:14px; color:var(--muted); margin-top:2px}
  @media (max-width:860px){ .hero{grid-template-columns:1fr; gap:32px; padding:44px 0 36px} }

  section.part{padding:56px 0; border-bottom:1px solid var(--line)}
  h2{font-size:22px; letter-spacing:-.025em; margin:0 0 6px}
  .cap{color:var(--muted); font-size:14px; margin:0 0 24px; max-width:46em}

  /* 막대: 바탕 칸 없이 채움만, 고른 곳만 강조색 */
  .bars{display:grid; grid-template-columns:minmax(120px,220px) 1fr; gap:9px 18px; align-items:center; max-width:880px}
  .bars .lab{font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bars .row{display:flex; align-items:center; gap:10px}
  .bars .fill{height:12px; background:var(--bar); min-width:3px}
  .bars .v{font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}
  .bars .me{color:var(--ink); font-weight:800}
  .bars .row.me .fill{background:var(--accent)}
  .bars .row.me .v{color:var(--ink); font-weight:800}
  .bars .gap{grid-column:1/-1; height:1px; background:var(--line); margin:4px 0}
  @media (max-width:560px){ .bars{grid-template-columns:96px 1fr} }

  /* 할 일 둘 */
  .acts{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px}
  @media (max-width:860px){ .acts{grid-template-columns:1fr; gap:40px} }
  ol.plan{list-style:none; margin:0; padding:0}
  ol.plan li{display:grid; grid-template-columns:140px 1fr; gap:16px; padding:16px 0; border-top:1px solid var(--line)}
  ol.plan li:first-child{border-top:0; padding-top:4px}
  ol.plan .t{font-weight:800; font-size:15px}
  ol.plan .d{color:var(--muted)}
  @media (max-width:560px){ ol.plan li{grid-template-columns:1fr; gap:2px} }

  form.sub-form{background:var(--paper); border:1px solid var(--line); padding:26px}
  form.sub-form h3{margin:0 0 4px; font-size:19px; letter-spacing:-.02em}
  form.sub-form p{margin:0 0 18px; color:var(--muted); font-size:14px}
  .field{display:grid; gap:6px; margin-bottom:12px}
  .field label{font-size:13px; font-weight:700}
  .field input{font:15px var(--font); padding:11px 12px; border:1px solid var(--line); background:var(--ground); color:var(--ink); border-radius:0}
  .agree{display:flex; gap:8px; font-size:13px; color:var(--muted); margin:4px 0 16px}
  .btns{display:flex; flex-wrap:wrap; gap:8px}
  .btn{font:700 15px var(--font); padding:12px 20px; border:1px solid var(--ink); background:var(--ink); color:var(--ground); cursor:pointer; border-radius:0; white-space:nowrap; text-decoration:none; display:inline-block}
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn.hot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5; cursor:not-allowed}
  .flag{font-size:12.5px; color:var(--accent); font-weight:600; margin-top:12px}

  /* 후원 띠 */
  .give{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:32px; align-items:center; padding:48px 0}
  .give p{margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; max-width:30em}
  .give p span{display:block; font-size:15px; font-weight:400; color:var(--muted); margin-top:6px}
  @media (max-width:700px){ .give{grid-template-columns:1fr} }

  .src{font-size:12.5px; color:var(--faint); padding:22px 0 8px}
  details.memo{margin:8px 0 64px; font-size:14px; color:var(--muted); background:var(--tint); padding:14px 18px}
  details.memo summary{cursor:pointer; font-weight:700; color:var(--ink)}
  details.memo ul{margin:10px 0 0; padding-left:18px}

  /* 고향사랑 사업 */
  .things{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .thing{background:var(--paper); border:1px solid var(--line); padding:16px 18px}
  .thing .nm{font-weight:700; margin:0 0 8px}
  .thing .m{font-size:14px; font-variant-numeric:tabular-nums; color:var(--muted)}
  .thing .m b{font-size:20px; color:var(--ink)}

  /* 투표 후보 */
  .cands{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
  @media (max-width:860px){ .cands{grid-template-columns:1fr} }
  .cand{background:var(--paper); border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:12px}
  .cand:nth-child(2){background:var(--tint)}
  .cand .ph{font-size:24px; font-weight:800; letter-spacing:-.03em}
  .cand dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px}
  .cand dt{color:var(--faint)}
  .cand dd{margin:0; color:var(--muted)}
  .cand .btn{align-self:flex-start; margin-top:auto}

  /* 노들섬 */
  .cols{display:flex; align-items:flex-end; gap:4px; height:140px; max-width:880px}
  .cols span{flex:1; background:var(--bar); min-height:2px}
  .cols span.hot{background:var(--accent)}
  .colx{display:flex; gap:4px; font-size:11.5px; color:var(--faint); max-width:880px; margin-top:6px}
  .colx span{flex:1; text-align:center}
  ul.feed{list-style:none; padding:0; margin:28px 0 0; max-width:880px}
  ul.feed li{display:grid; grid-template-columns:110px 1fr; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:15px}
  ul.feed .d{color:var(--faint); font-variant-numeric:tabular-nums; font-size:14px}

  /* 한 장 */
  .sheet{background:var(--paper); border:1px solid var(--line); padding:44px 48px; max-width:900px}
  @media (max-width:640px){ .sheet{padding:26px 20px} }
  .sheet .top{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--muted); font-weight:600}
  .sheet .who{font-size:clamp(34px,5vw,56px); font-weight:800; letter-spacing:-.04em; line-height:1.1; margin:26px 0 6px}
  .sheet .meta{color:var(--muted); font-size:14px; margin:0 0 32px}
  .sharp{list-style:none; margin:0 0 36px; padding:0}
  .sharp li{display:grid; grid-template-columns:190px 1fr; gap:22px; align-items:baseline; padding:20px 0; border-top:2px solid var(--ink)}
  .sharp .n{font-size:34px; font-weight:800; letter-spacing:-.04em; color:var(--accent); line-height:1}
  .sharp .t{font-size:18px; font-weight:700; letter-spacing:-.02em}
  .sharp .r{font-size:14px; color:var(--muted); font-weight:400; display:block; margin-top:4px}
  @media (max-width:640px){ .sharp li{grid-template-columns:1fr; gap:6px} }
  .four{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  @media (max-width:640px){ .four{grid-template-columns:1fr} }
  .four > div{padding:18px 20px; background:var(--tint)}
  .four > div:nth-child(1){background:var(--ink); color:var(--ground)}
  .four > div:nth-child(1) .q small{color:var(--bar)}
  .four .q{font-weight:800; font-size:17px; margin-bottom:6px}
  .four .q small{display:block; font-weight:500; font-size:13px; color:var(--muted)}
  .four .a{font-size:14.5px}
  .sheet .foot{display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:32px; padding-top:20px; border-top:1px solid var(--line)}
  .sheet .foot b{font-size:17px}
  .qr{width:84px; height:84px; border:1px dashed var(--faint); display:grid; place-items:center; font-size:11px; color:var(--faint); text-align:center; flex:none}

  .empty{padding:120px 0; color:var(--muted)}
  @media print{
    header,.hero,.part:not(.print),.give,.src,details.memo,.no-print{display:none !important}
    body{background:#fff}
    .sheet{border:0; padding:0; max-width:none}
  }
</style>

<header><div class="wrap">
  <span class="mark">살림을 보는 시민<small>문 초안</small></span>
  <nav id="nav" aria-label="문"></nav>
  <div class="pick">
    <select id="sido" aria-label="시도"></select>
    <select id="place" aria-label="자치단체"></select>
  </div>
</div></header>

<main class="wrap" id="main"><p class="empty">자료를 읽는 중입니다.</p></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const 받침 = s => { const c = String(s).trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
const 은 = s => s + (받침(s) ? '은' : '는');
const 이 = s => s + (받침(s) ? '이' : '가');
const 을 = s => s + (받침(s) ? '을' : '를');
const 돈 = v => v == null ? '-' : v === 0 ? '0원' : Math.abs(v) >= 1e12 ? (v / 1e12).toFixed(1) + '조 원' : Math.abs(v) >= 1e8 ? Math.round(v / 1e8).toLocaleString() + '억 원' : Math.round(v / 1e4).toLocaleString() + '만 원';
const 퍼 = (v, d = 1) => v == null ? '-' : (+v).toFixed(d) + '%';
const 갈래말 = g => ({광역: '광역', 시: '시', 군: '군', 구: '구'}[g] || g);

let D, 곳, i = 0;
const 이름 = j => D.이름[j];
const 달 = () => +D.진행기준.slice(4);

// 같은 갈래 안에서 높은 쪽부터 몇 번째인가
function 순위(arr, j) {
  if (arr[j] == null) return null;
  const g = 곳[j][3], 같은 = 곳.map((c, x) => x).filter(x => 곳[x][3] === g && arr[x] != null);
  return {k: 같은.filter(x => arr[x] > arr[j]).length + 1, n: 같은.length, g};
}
const 순위말 = r => r ? `같은 ${갈래말(r.g)} ${r.n}곳 가운데 ${r.k}위` : '';
const 몇째 = k => k === 1 ? '가장' : `${k}번째로`;

// 같은 갈래 위 10곳 + 고른 곳(10 밖이면 줄 하나 띄우고 덧붙임)
function 막대(arr, fmt) {
  const g = 곳[i][3];
  const js = 곳.map((c, x) => x).filter(x => 곳[x][3] === g && arr[x] != null).sort((a, b) => arr[b] - arr[a]);
  const 위 = js.slice(0, 10), 큰 = Math.max(arr[js[0]] || 0, 1e-9);
  const 줄 = j => `<div class="lab${j === i ? ' me' : ''}" title="${esc(이름(j))}">${js.indexOf(j) + 1}. ${esc(이름(j))}</div>
    <div class="row${j === i ? ' me' : ''}"><div class="fill" style="width:${Math.max(0, arr[j]) / 큰 * 82}%"></div><span class="v">${fmt(arr[j])}</span></div>`;
  return `<div class="bars">${위.map(줄).join('')}${!위.includes(i) && arr[i] != null ? '<div class="gap"></div>' + 줄(i) : ''}</div>`;
}

const 받기 = (제목, 말) => `
  <form class="sub-form" onsubmit="return false">
    <h3>${제목}</h3><p>${말}</p>
    <div class="field"><label for="f-n">이름</label><input id="f-n" disabled></div>
    <div class="field"><label for="f-p">휴대전화</label><input id="f-p" type="tel" disabled></div>
    <div class="field"><label for="f-e">이메일 (선택)</label><input id="f-e" type="email" disabled></div>
    <label class="agree"><input type="checkbox" disabled> 개인정보 수집·이용에 동의합니다. [방침 링크 자리]</label>
    <div class="btns"><button class="btn hot" disabled>받아 보기</button><button type="button" class="btn ghost" data-share>친구에게 보내기</button></div>
    <div class="flag">초안이라 아직 받지 않습니다. 명부와 동의 문구가 정해지면 엽니다.</div>
  </form>`;

const 후원 = `<div class="give">
  <p>이 일을 내년에도, 그다음 해에도 하려면 회원이 필요합니다.
    <span>함께하는 시민행동은 27년째 세금이 어디로 가는지 따라가고, 밑빠진독상을 주는 단체입니다.</span></p>
  <a class="btn" href="#" title="도너스 정기후원 링크 자리">정기후원</a>
</div>`;

const 할일 = 줄 => `<ol class="plan">${줄.map(([t, d]) => `<li><span class="t">${t}</span><span class="d">${d}</span></li>`).join('')}</ol>`;
const 메모 = 줄 => `<details class="memo"><summary>초안 메모 (화면에는 안 나갈 것)</summary><ul>${줄.map(x => `<li>${x}</li>`).join('')}</ul></details>`;
const 머리 = (when, h, sub, n, l, s) => `<div class="hero"><div><span class="when">${when}</span><h1>${h}</h1><p class="sub">${sub}</p></div>
  ${n == null ? '<div></div>' : `<div class="big"><div class="n">${n}</div><div class="l">${l}</div><div class="s">${s || ''}</div></div>`}</div>`;
const 둘 = (계획, 받기칸) => `<section class="part"><div class="acts"><div><h2>시민행동이 할 일</h2><p class="cap">날짜를 걸고 약속합니다.</p>${계획}</div><div>${받기칸}</div></div></section>`;

// ── 한 장: 이 동네가 같은 갈래에서 가장 앞서는 세 가지를 스스로 고른다 ──
const 날줄들 = [
  {k: '계약', 값: j => D.계약[j] && D.계약[j][3], 자리: 0, 주어: '경쟁 없이 맺은 계약 비중',
   글: (v, 금) => `${D.계약해}년 계약 금액의 ${퍼(v, 0)}를 경쟁 없이(수의계약) 맺었습니다`},
  {k: '행사축제경비비율', 자리: 2, 주어: '행사·축제 비중', 금: true,
   글: (v, 금) => `행사·축제에 ${돈(금)}을 썼습니다 (결산의 ${퍼(v, 2)})`},
  {k: '업무추진비비율', 자리: 2, 주어: '업무추진비 비중', 금: true,
   글: (v, 금) => `업무추진비로 ${돈(금)}을 썼습니다 (결산의 ${퍼(v, 2)})`},
  {k: '지방의회경비비율', 자리: 2, 주어: '의회 운영비 비중', 금: true,
   글: (v, 금) => `의회 운영에 ${돈(금)}을 썼습니다 (결산의 ${퍼(v, 2)})`},
  {k: '연말지출비율', 자리: 1, 주어: '연말 몰아 쓰기 비중',
   글: v => `한 해 쓴 돈의 ${퍼(v)}를 11~12월 두 달에 썼습니다`},
  {k: '추경 증가율', 자리: 1, 주어: '추경으로 늘린 비율', 금: true,
   글: (v, 금) => `처음 정한 예산을 추경으로 ${돈(금)} 늘렸습니다 (${퍼(v)})`},
  {k: '예산대비채무비율', 자리: 1, 주어: '예산 대비 빚',
   글: v => `빚이 예산의 ${퍼(v)}입니다`},
];
// 같은 갈래 위쪽 3분의 1 안에 드는 것만, 앞선 차례로 셋까지. 하나도 없으면 가장 앞선 하나.
function 날카로운셋(j) {
  const 다 = 날줄들.map(x => {

    + 후원 + 메모(['후보 셋은 자리만. 독상 감시사업 등록 폼으로 들어온 것 가운데 확인을 마친 것을 넣는다.', '고른 사람 수는 참여 수이지 후원자 수가 아니다.']);
  }},

  watch: {이름: '지켜보는 사업', 그리기() {
    const w = D.지켜봄['노들섬'];
    if (!w) return '<p class="empty">지켜보는 사업 자료가 없습니다.</p>';
    const 큰 = Math.max(...w.달.map(x => x[1]), 1), 최대 = w.달.reduce((a, x) => x[1] > a[1] ? x : a, w.달[0]);
    const 날 = d => d.replace(/(\d{4})(\d\d)(\d\d)/, '$1.$2.$3');
    return 머리('지켜보는 사업 · 1년 내내',
      `지난 4년, 서울시의회는<br><em>${w.임기회의수}번의 회의</em>에서 노들섬을 이야기했습니다.`,
      '누가 묻고 서울시가 뭐라고 답했는지, 회의록이 올라오는 날 골라서 알려 드립니다.',
      w.임기회의수, '노들섬이 나온 회의', '8대 서울시의회 (2022.7~2026.6)')
    + `<section class="part"><h2>달마다 노들섬이 나온 횟수</h2><p class="cap">최근 18달. 가장 많았던 달은 ${최대[0].slice(0, 4)}년 ${+최대[0].slice(4)}월(${최대[1]}번)입니다.</p>
      <div class="cols">${w.달.map(([m, n]) => `<span class="${m === 최대[0] ? 'hot' : ''}" style="height:${n / 큰 * 100}%" title="${m.slice(0, 4)}.${m.slice(4)} ${n}번"></span>`).join('')}</div>
      <div class="colx">${w.달.map(([m]) => `<span>${m.slice(4) === '01' || m === w.달[0][0] ? m.slice(2, 4) + '.' : ''}${+m.slice(4)}</span>`).join('')}</div>
      <ul class="feed">${w.최근.slice(0, 5).map(x => `<li><span class="d">${날(x.날짜)}</span><a href="https://clik.nanet.go.kr/potal/search/searchView.do?DOCID=${encodeURIComponent(x.DOCID)}&collection=${x.갈래 === '회의록' ? 'minutes' : 'bill'}" target="_blank" rel="noopener">${esc(x.글.replace(/^\d{8}\s*/, ''))}</a></li>`).join('')}</ul></section>`
    + 둘(할일([['회의록이 올라오는 날', '노들섬이 나온 대목만 골라 보내 드립니다.'], ['예산 심사 때', '노들섬 예산이 어떻게 바뀌는지 따로 짚습니다.'], ['언제든', '우리 동네 사업도 지켜봐 달라고 요청할 수 있습니다.']]),
      받기('노들섬 소식 받아 보기', '새 회의에서 노들섬이 나오면 알려 드립니다.'))
    + 후원 + `<p class="src">출처: 국회도서관 지방의회 회의록(CLIK) 낱말 찾기 「노들섬」, 서울시의회. 같은 회의의 여러 쪽은 하나로 셌습니다.</p>`
    + 메모(['2026년 7월부터 0번이다. 새 의회가 조용한 건지, CLIK 에 늦게 올라오는 건지, 수집 범위 탓인지 확인 전. 확인하기 전엔 밖에 내지 말 것.',
      '동네를 골라도 이 문은 바뀌지 않는다(서울시의회 노들섬 하나). 사업을 더 붙이면 사업 고르는 칸이 생긴다.',
      '「이야기했다」는 회의록 본문에 낱말이 나왔다는 뜻. 지나가는 언급도 센다.']);
  }},
};

function 그리기() {
  const 문 = (location.hash.slice(1) in 문들) ? location.hash.slice(1) : 'one';
  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', a.dataset.d === 문 ? 'page' : 'false'));
  $('main').innerHTML = `<div class="door">${문들[문].그리기()}</div>`;
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(location.href).then(() => { b.textContent = '주소를 복사했습니다'; setTimeout(() => b.textContent = '친구에게 보내기', 1800); });
  });
  document.title = `${문들[문].이름} · ${이름(i)} · 문 초안`;
}

function 시작() {
  $('nav').innerHTML = Object.entries(문들).map(([k, v]) => `<a href="#${k}" data-d="${k}">${v.이름}</a>`).join('')
    + `<a href="../site/score.html">투명성 지표</a><a href="town.html?cd=${곳[i] ? 곳[i][0] : ''}" style="color:var(--accent)">시민 화면 시안</a>`;
  const 시도들 = [...new Set(곳.map(c => c[2]))];
  $('sido').innerHTML = 시도들.map(s => `<option>${esc(s)}</option>`).join('');
  const 채우기 = s => { $('place').innerHTML = 곳.map((c, j) => c[2] === s ? `<option value="${j}">${esc(이름(j).replace(/^\S+\s/, ''))}</option>` : '').join(''); };
  const cd = new URLSearchParams(location.search).get('cd');
  i = 곳.findIndex(c => c[0] === cd); if (i < 0) i = Math.max(0, 곳.findIndex(c => c[0] === '1111000'));
  $('sido').value = 곳[i][2]; 채우기(곳[i][2]); $('place').value = i;
  const 바꿈 = () => { history.replaceState(null, '', '?cd=' + 곳[i][0] + location.hash); 그리기(); };
  $('sido').onchange = () => { 채우기($('sido').value); i = +$('place').value; 바꿈(); };
  $('place').onchange = () => { i = +$('place').value; 바꿈(); };
  addEventListener('hashchange', () => { 그리기(); scrollTo(0, 0); });
  그리기();
}

fetch('data.json').then(r => r.json()).then(d => { D = d; 곳 = d.곳; 시작(); })
  .catch(e => { $('main').innerHTML = `<p class="empty">data.json 을 못 읽었습니다. 저장소 맨 위에서 python -m http.server 8765 로 여세요. (${esc(e)})</p>`; });
</script>
