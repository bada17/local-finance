# PC 에서 받은 원자료를 Cloudflare R2 로 올린다 — 키는 깃허브에만 있다(이 PC 엔 없다).
#
# 쓰는 법(2026-10-16): PC 에서 파일을 릴리스 `suui-move` 에 붙이면 이 봇이 돈다.
#   gh release create suui-move data/수의계약/*.json.gz --title "R2 로 옮길 것(잠깐)" --notes "봇이 R2 로 옮기고 지운다"
# → 내려받아 R2(수의계약/)에 올리고, 다시 내려받아 견준 뒤 **같으면 릴리스를 지운다.** 저장소 기록엔 안 남는다.
# ⚠️ 릴리스는 공개라 옮기는 몇 분 동안은 누구나 볼 수 있다(공공 자료라 괜찮다고 봄).
# 지난 쓰임: 2026-10-01 CLIK 상세(data/clik/상세 → clik/상세)를 저장소에서 옮겼다.
#   그때는 이 파일을 고쳐 푸시하면 돌았는데, 고칠 때마다 빈 폴더를 올리려다 빨갛게 떠서 그 길은 뺐다.
name: R2 로 옮기기

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write     # 다 옮긴 뒤 릴리스를 지운다

jobs:
  move:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'suui-move'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: 수의계약 사유 올리기
        run: |
          gh release download suui-move -D data/수의계약
          sh scripts/r2_sync.sh up data/수의계약 수의계약
          # 올라갔는지 — 내려받아 하나씩 견준다
          rm -rf /tmp/back && sh scripts/r2_sync.sh down /tmp/back 수의계약
          for f in data/수의계약/*.json.gz; do cmp "$f" "/tmp/back/$(basename "$f")"; done
          echo '같다 — 다 올라갔다'
          gh release delete suui-move --cleanup-tag -y
