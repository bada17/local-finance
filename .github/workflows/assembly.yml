name: 국회 회의록 낱말 알림

# 22대 본회의·위원회 회의록 전문 화면에서 「미래대응기금」을 찾아 텔레그램으로(scripts/watch_assembly.py).
# 처음 한 번은 2026년 치를 다 훑느라 몇 시간 걸린다. 스크립트가 300분에서 스스로 멈추고 다음 날 이어간다.
on:
  schedule:
    - cron: '50 20 * * *'       # UTC 20:50 = 한국 시간 새벽 5시 50분
    - cron: '50 2 * * *'        # UTC 02:50 = 낮 11시 50분 — 아침에 서버 문제로 못 본 것만 다시(국회 + 노들섬)
  workflow_dispatch:
    inputs:
      resend:
        description: '찾은 것 전부 다시 보내기(국회 + 노들섬)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: assembly
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q holidays   # 주말·공휴일엔 알림 안 보냄(watch_clik.보내는날)
      - name: 회의록 훑기
        env:
          ASSEMBLY_KEY: ${{ secrets.ASSEMBLY_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watch_assembly.py ${{ inputs.resend && '--분 0 --다시보내기' || (github.event.schedule == '50 2 * * *' && '--분 120 --마지막시도' || '--분 300') }}
      - name: 노들섬 낮 재시도(아침에 못 봤을 때만 실제로 돈다)
        if: ${{ github.event.schedule == '50 2 * * *' }}
        env:
          CLIK_KEY: ${{ secrets.CLIK_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watch_clik.py --마지막시도
      - name: 노들섬 다시 보내기(손으로 resend 켰을 때만 — 모음·호출 수는 여기서 올리지 않는다)
        if: ${{ inputs.resend }}
        env:
          CLIK_KEY: ${{ secrets.CLIK_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watch_clik.py --다시보내기
      - name: 올리기
        if: ${{ !cancelled() }}
        run: sh scripts/bot_push.sh "국회 회의록 낱말 알림 $(date -u +%Y-%m-%d)" data/assembly data/clik/알림_모음.json data/clik/상태.json
