# 공모사업 — e나라도움 「공모사업 목록」·공모정보(선정결과) 2019 ~ 올해를 일주일에 한 번 받는다
# (2026-11-12 사용자 「공모사업은 이전부터 하는게 나오니까 19년자료부터 별도로 수집하는 봇을 만들어」). scripts/fetch_bojo_contests.py
# 선정된 곳 이름이 있어 저장소에 안 올리고 R2(공모/)에 둔다. 틀은 national-grants.yml 그대로 —
# 한 번에 290분까지 받고, 시간이 다 돼 멈췄으면 끝에서 자기를 다시 부른다. 다 받으면 시간 전에 끝나 고리가 멈춘다.
name: 공모사업

on:
  schedule:
    - cron: '47 19 * * 0'  # 일요일 UTC 19:47 = 한국 시간 월요일 새벽 4시 47분 — 국고보조 받은 곳(3:17)과 안 겹치게
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 끝에서 자기를 다시 부르기

concurrency:
  group: bojo-contests
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 내려받기가 안 되면 여기서 멈춘다 — 받은 것을 모르고 처음부터 받지 않게
      - run: sh scripts/r2_sync.sh down data/bojo_contests 공모
      - id: fetch
        name: 목록·상세 받기
        timeout-minutes: 310
        continue-on-error: true
        shell: bash   # pipefail — 스크립트가 죽으면 빨갛게 멈추고 다시 부르지 않는다
        run: |
          python -u scripts/fetch_bojo_contests.py --시간 290 | tee fetch.log
          if grep -q '시간이 다 돼 멈춘다' fetch.log; then echo more=1 >> "$GITHUB_OUTPUT"; fi
      - name: R2 로 올리기
        if: ${{ !cancelled() }}
        run: sh scripts/r2_sync.sh up data/bojo_contests 공모
      - name: 얼마나 찼나
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import gzip, json, glob, os
          for p in sorted(glob.glob('data/bojo_contests/20[0-9][0-9].json.gz')):
              d = json.load(gzip.open(p, 'rt', encoding='utf-8'))
              상 = d['상세'].values()
              print(f"{os.path.basename(p)[:4]}: 목록 {len(d['목록']):,} · 상세 {len(d['상세']):,} · 선정결과 있음 {sum(1 for v in 상 if v.get('선정결과')):,} · 오류 {sum(1 for v in 상 if v.get('오류')):,}")
          PY
      - name: 남았으면 이어 부르기
        if: ${{ !cancelled() && steps.fetch.outputs.more == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bojo-contests.yml --ref ${{ github.ref_name }}
