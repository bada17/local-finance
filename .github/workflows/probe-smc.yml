name: 서울시의회 누리집 닿나(한 번)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd scripts
          for i in 1 2 3; do python -c "import watch_clik as w; r=w.시의회누리집(w.누리집['002001'],'노들섬','20260701'); print('try', $i, len(r))" 2>&1 | tail -1; done
