# 수의계약 사유만 굽어 보기 — R2 에서 내려받아 build_suui.py 를 돌리고 site/data/suui.json 을 실행 결과물로 남긴다.
# 저장소·페이지는 안 바꾼다(올리는 건 달마다 굽기 monthly.yml 몫). 이 PC 엔 R2 키가 없어 PC 에서 숫자를 볼 때 쓴다.
#   gh workflow run suui.yml && gh run download <번호> -n suui -D site/data
name: 수의계약 사유 굽어 보기

on:
  workflow_dispatch:
    inputs:
      raw:
        description: '원자료(data/수의계약)도 하루짜리 결과물로 남기나 — PC 에서 살펴볼 때'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: sh scripts/r2_sync.sh down data/수의계약 수의계약
      - run: python scripts/build_suui.py
      - uses: actions/upload-artifact@v4
        with:
          name: suui
          path: site/data/suui.json
      - if: ${{ inputs.raw }}
        uses: actions/upload-artifact@v4
        with:
          name: suui-raw
          path: data/수의계약
          retention-days: 1
