# site/ 를 깃허브 페이지로 올린다.
# main 에 푸시될 때마다, 또는 손으로 돌릴 때.
name: 페이지 올리기

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # 무인 회수기 화면(/kiosk/)은 2026-11-09 비공개 저장소 bada17/pet-recovery 로 떼어 냈다 — 웹에 안 올린다
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
