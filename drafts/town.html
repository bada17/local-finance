<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 살림 · 함께하는 시민행동</title>
<meta name="description" content="우리 동네의 예산 공개와 큰 사업의 결정을 시민의 눈으로 살펴보는 함께하는 시민행동의 회의용 시안입니다.">
<link rel="icon" href="https://cdn.imweb.me/upload/S20210826b814397ca4e6d/2a859fe4ace59.png">
<!-- ⚠️ 시민용 「우리 동네 페이지」 시안. site/ 밖이라 배포되지 않는다.
     보기: 저장소 맨 위에서 python -m http.server 8765 → /drafts/town.html?cd=4177000  (철 바꿔 보기: &m=2)
     데이터: drafts/data.json (scripts/build_drafts.py) · drafts/shapes.json (scripts/build_shapes.py)
     활동 사례: drafts/activities.json (2026-10-12 보유 자료에서 추린 회의용 스냅샷, 자동 갱신 아님)
     색·글꼴·모양은 시민행동 홈 개편판 DESIGN.md 값을 그대로 쓴다(바꾸지 말 것). 화면 글에는 긴 줄표를 쓰지 않는다.
     문을 고르는 내부 검토판은 drafts/index.html 이다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  @font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
  @font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
  :root{
    /* 시민행동 DESIGN.md 한 벌 */
    --brand:#00afec; --deep:#0079a6; --tint:#e2f5fd; --band:#eef7fb; --navy:#062330;
    --ink:#0b1e28; --soft:#4a6473; --faint:#7d95a3; --line:#d5e4eb; --paper:#f1f6f8;
    --flag:#9a5c06; --flag-bg:#fff4e1; --flag-line:#ecd3a2;
    --ground:#ffffff; --card:#ffffff; --on-navy:#ffffff; --on-deep:#ffffff;
    --title:'GmarketSans',Pretendard,sans-serif;
    --body:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --brand:#2bbff2; --deep:#7fd3f5; --tint:#0f3243; --band:#0b2633; --navy:#04161f;
      --ink:#e6f1f6; --soft:#a7bcc8; --faint:#7d95a3; --line:#1e3d4c; --paper:#0b2633;
      --flag:#f0b35a; --flag-bg:#2b2010; --flag-line:#5a4420;
      --ground:#071c26; --card:#0c2532; --on-navy:#e6f1f6; --on-deep:#04161f;
    }
  }
  :root[data-theme="dark"]{
    --brand:#2bbff2; --deep:#7fd3f5; --tint:#0f3243; --band:#0b2633; --navy:#04161f;
    --ink:#e6f1f6; --soft:#a7bcc8; --faint:#7d95a3; --line:#1e3d4c; --paper:#0b2633;
    --flag:#f0b35a; --flag-bg:#2b2010; --flag-line:#5a4420;
    --ground:#071c26; --card:#0c2532; --on-navy:#e6f1f6; --on-deep:#04161f;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0; background:var(--ground); color:var(--ink); font:16px/1.65 var(--body); word-break:keep-all; padding-bottom:84px}
  a{color:var(--deep)}
  .wrap{max-width:1180px; margin:0 auto; padding-inline:24px}
  @media (max-width:640px){ .wrap{padding-inline:16px} }
  h1,h2,h3,.t{font-family:var(--title); font-weight:700; letter-spacing:-.022em; line-height:1.35}
  :focus-visible{outline:2px solid var(--deep); outline-offset:2px}
  .pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; font:600 13px var(--body); padding:4px 12px; border:1px solid var(--line); color:var(--soft); background:var(--ground); white-space:nowrap}
  .pill.now{background:var(--deep); border-color:var(--deep); color:var(--on-deep)}
  .tbd{display:inline-flex; align-items:center; gap:4px; border-radius:999px; font:600 12px var(--body); padding:2px 10px; color:var(--flag); background:var(--flag-bg); border:1px solid var(--flag-line)}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; font:700 15px var(--body); padding:12px 22px; border:1px solid var(--deep); background:var(--deep); color:var(--on-deep); cursor:pointer; white-space:nowrap; text-decoration:none}
  .btn.line{background:transparent; color:var(--deep)}
  .btn.sky{background:var(--brand); border-color:var(--brand); color:var(--navy)}
  .btn.sm{font-size:13px; padding:7px 14px}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45; cursor:not-allowed}

  /* 머리 */
  .top{position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--line)}
  .top .wrap{display:flex; align-items:center; gap:16px; height:68px}
  .logo{display:block; width:132px; height:50px; overflow:hidden; flex:none}
  .logo img{display:block; height:50px; width:auto; max-width:none; transform:translateX(-22px)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .logo img{filter:brightness(0) invert(1)} }
  .site{font:700 15px var(--title); color:var(--ink); padding-left:16px; border-left:1px solid var(--line); white-space:nowrap}
  .top .sp{flex:1}
  .town-btn{display:inline-flex; align-items:center; gap:8px; border-radius:999px; border:1px solid var(--ink); background:var(--ground); color:var(--ink); font:700 14px var(--body); padding:8px 16px; cursor:pointer}
  @media (max-width:640px){ .site{display:none} .logo{width:110px; height:42px} .logo img{height:42px; transform:translateX(-18px)} }

  /* 첫 덩이: 흰 바탕 한 덩이, 밑변 2px 잉크 선 */
  .hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:48px; align-items:center; padding:56px 0 40px; border-bottom:2px solid var(--ink)}
  .crumb{font-size:14px; color:var(--soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .crumb i{color:var(--faint)}
  .hero h1{font-size:clamp(44px,7vw,84px); line-height:1.08; margin:14px 0 18px; letter-spacing:-.04em}
  .hero .lead{font-size:clamp(19px,2.1vw,24px); line-height:1.5; margin:0; max-width:24em; font-weight:500}
  .hero .lead b{color:var(--deep); font-weight:800}
  .hero .lead small{display:block; font-size:16px; color:var(--soft); font-weight:400; margin-top:10px}
  .nums{display:flex; flex-wrap:wrap; gap:28px 40px; margin-top:34px; padding-top:22px; border-top:1px solid var(--line)}
  .nums div{font-size:13px; color:var(--soft)}
  .nums b{display:block; font:700 24px var(--title); color:var(--ink); letter-spacing:-.02em; margin-top:2px}
  .map{position:relative; aspect-ratio:1/1; max-height:520px; justify-self:center; width:100%}
  .map svg.town{width:100%; height:100%; display:block}
  .map svg.town path{fill:var(--brand); stroke:var(--brand); stroke-width:1.2; stroke-linejoin:round}
  .map svg.town{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  .map .korea{position:absolute; right:0; bottom:0; width:22%; min-width:84px}
  .map .korea path{fill:var(--line); stroke:none}
  .map .korea circle{fill:var(--deep); stroke:var(--ground); stroke-width:6}
  @keyframes rise{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
  @media (max-width:860px){
    .hero{grid-template-columns:1fr; gap:8px; padding:28px 0 32px}
    .map{order:-1; max-height:260px; aspect-ratio:auto; height:260px}
  }

  section{padding:72px 0}
  .sec-hd{margin-bottom:28px}
  .sec-hd h2{font-size:clamp(24px,3vw,32px); margin:0}
  .sec-hd p{margin:6px 0 0; color:var(--soft)}

  /* 지금 볼 것 */
  .now{background:var(--band)}
  .feat{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:48px; align-items:end}
  @media (max-width:860px){ .feat{grid-template-columns:1fr; gap:28px} }
  .feat .when{display:flex; gap:8px; align-items:center; margin-bottom:18px}
  .feat h2{font-size:clamp(28px,4vw,46px); line-height:1.25; margin:0}
  .feat h2 em{font-style:normal; color:var(--deep)}
  .feat .why{font-size:17px; color:var(--soft); margin:18px 0 0; max-width:34em}
  .feat .why b{color:var(--ink)}
  .gauge{margin-top:30px; max-width:640px}
  .gauge .bar{display:flex; height:22px; border:1px solid var(--ink)}
  .gauge .bar span:first-child{background:var(--ink)}
  .gauge .bar span:last-child{background:repeating-linear-gradient(135deg,var(--brand) 0 6px,transparent 6px 12px)}
  .gauge .lab{display:flex; justify-content:space-between; font-size:14px; margin-top:8px; color:var(--soft)}
  .gauge .lab b{color:var(--ink); font-family:var(--title)}
  .promise{background:var(--card); border:1px solid var(--line); padding:26px}
  .promise .k{font-size:13px; color:var(--soft); font-weight:700}
  .promise .p{font:700 20px/1.45 var(--title); margin:6px 0 18px; letter-spacing:-.02em}
  .promise ul{margin:0 0 20px; padding:0; list-style:none; font-size:15px; color:var(--soft)}
  .promise li{display:flex; gap:10px; padding:6px 0}
  .promise li i{color:var(--deep); font-size:18px; margin-top:2px}

  /* 세 줄 카드 */
  .cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
  .card.more-card{background:var(--paper); border-style:dashed; border-color:var(--line)}
  .card.more-card .n{margin-top:auto}
  .gauge .note{font-size:13px; color:var(--faint); margin:6px 0 0}
  @media (max-width:860px){ .cards{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:82%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding-bottom:8px} .cards::-webkit-scrollbar{display:none} .cards > *{scroll-snap-align:start} }
  .share{display:flex; flex-direction:column; gap:10px}
  .card{aspect-ratio:1/1; padding:28px; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); color:var(--ink); position:relative; overflow:hidden}
  .card.c0{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
  .card.c1{background:var(--tint); border-color:var(--tint)}
  .card .who{font-size:14px; font-weight:700; opacity:.8}
  .card .n{font:700 clamp(40px,4.6vw,58px)/1 var(--title); letter-spacing:-.04em; margin-top:auto}
  .card.c0 .n{color:var(--brand)}
  .card .n + .s{font:700 18px/1.45 var(--title); margin-top:14px; letter-spacing:-.02em}
  .card .r{font-size:14px; margin-top:8px; opacity:.8}
  .card .ft{display:flex; justify-content:space-between; align-items:center; gap:12px; white-space:nowrap; font-size:12px; margin-top:22px; padding-top:12px; border-top:1px solid currentColor; opacity:.75}
  .card svg.ghost{position:absolute; right:-8%; top:-6%; width:58%; opacity:.12}
  .card svg.ghost path{fill:currentColor}
  .card.c0 svg.ghost{opacity:.18}
  .card.c0 svg.ghost path{fill:var(--brand)}
  .share .acts{display:flex; gap:8px}

  /* 네 가지 질문 */
  .four{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:2px solid var(--ink)}
  @media (max-width:760px){ .four{grid-template-columns:1fr} }
  .four > div{display:grid; grid-template-columns:52px 1fr; gap:16px; padding:26px 8px 26px 0; border-bottom:1px solid var(--line)}
  .four > div:nth-child(odd){padding-right:32px}
  @media (min-width:761px){ .four > div:nth-child(even){padding-left:32px; border-left:1px solid var(--line)} }
  .four i.ph{font-size:30px; color:var(--deep); width:52px; height:52px; display:grid; place-items:center; background:var(--tint); border-radius:999px}
  .four h3{margin:0; font-size:20px}
  .four h3 small{font:400 14px var(--body); color:var(--soft); margin-left:6px; letter-spacing:0}
  .four p{margin:6px 0 0; font-size:16px}
  .four p b{font-family:var(--title)}
  .four .more{font-size:14px; margin-top:6px; display:inline-block}

  /* 철마다 여는 문 */
  .doors{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
  @media (max-width:980px){ .doors{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:560px){ .doors{grid-template-columns:1fr} }
  .door{background:var(--card); border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:10px; min-height:250px}
  .door:nth-child(2){background:var(--paper)}
  .door .h{display:flex; justify-content:space-between; align-items:center}
  .door h3{margin:0; font-size:19px}
  .door .n{font:700 34px/1.1 var(--title); letter-spacing:-.03em; color:var(--deep); margin-top:6px}
  .door p{margin:0; color:var(--soft); font-size:15px}
  .door .btn{margin-top:auto; align-self:flex-start}

  /* 한 해 달력 */
  .year{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); border-top:2px solid var(--ink)}
  .year > div{border-left:1px solid var(--line); padding:12px 10px 18px; min-height:150px; position:relative}
  .year > div:first-child{border-left:0}
  .year .m{font:700 15px var(--title); color:var(--faint)}
  .year .here{background:var(--band)}
  .year .here .m{color:var(--deep)}
  .year .here .m::after{content:'지금'; font:600 11px var(--body); margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--deep); color:var(--on-deep); vertical-align:2px}
  .year .ev{margin-top:10px; font-size:13.5px; line-height:1.45; font-weight:600}
  .year .ev small{display:block; font-weight:400; color:var(--soft)}
  @media (max-width:860px){
    .year{grid-template-columns:1fr; border-top:2px solid var(--ink)}
    .year > div{border-left:0; border-bottom:1px solid var(--line); min-height:0; display:grid; grid-template-columns:64px 1fr; gap:8px; padding:12px 0}
    .year > div:not(.has){display:none}
    .year .ev{margin-top:0}
  }

  /* 후원 */
  .give{background:var(--navy); color:var(--on-navy); padding:64px 0}
  .give .wrap{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:36px; align-items:center}
  @media (max-width:760px){ .give .wrap{grid-template-columns:1fr} }
  .give h2{font-size:clamp(24px,3vw,34px); margin:0}
  .give p{margin:10px 0 0; opacity:.8; max-width:36em}

  footer{padding:28px 0 40px; font-size:13px; color:var(--faint)}
  footer p{margin:4px 0}

  /* 아래 붙은 받아 보기 띠 */
  .dock{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--ground); border-top:1px solid var(--line); box-shadow:0 -6px 24px rgb(6 35 48 / .08)}
  .dock .wrap{display:flex; align-items:center; gap:14px; height:72px}
  .dock .t{font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dock .t span{color:var(--soft); font:400 14px var(--body); margin-left:8px}
  @media (max-width:640px){ .dock .t span{display:none} .dock .t{font-size:15px} }

  dialog{border:0; padding:0; max-width:560px; width:calc(100% - 32px); background:var(--ground); color:var(--ink); box-shadow:0 30px 80px rgb(6 35 48 / .35)}
  dialog::backdrop{background:rgb(6 35 48 / .55)}
  .dlg{padding:28px}
  .dlg h3{margin:0 0 4px; font-size:22px}
  .dlg .x{float:right; border:0; background:none; font-size:24px; color:var(--soft); cursor:pointer; line-height:1}
  .dlg .sub{color:var(--soft); margin:0 0 20px; font-size:15px}
  .field{display:grid; gap:6px; margin-bottom:14px}
  .field label{font-size:14px; font-weight:700}
  .field input{font:16px var(--body); padding:12px 14px; border:1px solid var(--line); background:var(--ground); color:var(--ink); border-radius:0}
  .wants{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:0; border:0}
  .wants legend{font-size:14px; font-weight:700; margin-bottom:8px; padding:0}
  .wants label{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:14px; cursor:pointer}
  .wants input{accent-color:var(--deep)}
  .agree{display:flex; gap:8px; font-size:14px; color:var(--soft); margin:4px 0 18px}
  .pick-list{max-height:52vh; overflow:auto; margin-top:14px}
  .pick-list h4{font:700 14px var(--title); margin:16px 0 8px; color:var(--soft)}
  .pick-list .g{display:flex; flex-wrap:wrap; gap:6px}
  .pick-list button{border-radius:999px; border:1px solid var(--line); background:var(--ground); color:var(--ink); font:500 14px var(--body); padding:5px 12px; cursor:pointer}
  .pick-list button[aria-current="true"]{background:var(--deep); border-color:var(--deep); color:var(--on-deep)}

  .reveal{opacity:0; transform:translateY(16px); transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1)}
  .reveal.in{opacity:1; transform:none}
  @media (prefers-reduced-motion:reduce){ .reveal{opacity:1; transform:none; transition:none} .map svg.town{animation:none} html{scroll-behavior:auto} }
  .loading{padding:160px 0; color:var(--soft)}

  /* Existing civic brand, developed as a readable activity page. */
  html{scroll-padding-top:100px}
  h1,h2,h3{text-wrap:balance}
  p{text-wrap:pretty}
  .skip{position:fixed;left:16px;top:-80px;z-index:50;padding:12px 20px;background:var(--ground);color:var(--ink);border:2px solid var(--deep)}
  .skip:focus{top:12px}
  .top .wrap{gap:22px}
  .activity-nav{display:flex;gap:24px;font-size:14px;font-weight:600;margin-left:auto}
  .activity-nav a{text-decoration:none;color:var(--soft)}
  .activity-nav a:hover{color:var(--deep)}
  .top .sp{display:none}
  .hero{grid-template-columns:1.15fr .85fr;gap:60px;padding:58px 0 24px;min-height:0}
  .hero h1{font-size:clamp(36px,4.8vw,62px);line-height:1.32;letter-spacing:-.045em;margin:18px 0 20px}
  .hero h1 span{color:var(--deep)}
  .hero .lead{font-size:18px;line-height:1.8;max-width:29em;margin:0;color:var(--soft)}
  .hero-actions{display:flex;align-items:center;gap:24px;margin-top:26px;flex-wrap:wrap}
  .hero-actions .text-link{font-size:14px;font-weight:700;text-underline-offset:5px}
  .map{height:330px;position:relative;background:var(--tint);border-radius:12px;display:grid;place-items:center;isolation:isolate;overflow:hidden}
  .map svg.town{height:76%;width:76%;animation:none;filter:none;fill:var(--brand)}
  .map .korea{width:60px;height:85px;right:20px;bottom:22px}
  .map::before,.map::after{content:'';position:absolute;border:1px solid var(--line);border-radius:50%;width:220px;height:220px;z-index:-1}
  .map::after{width:370px;height:370px}
  .map-label{position:absolute;top:22px;left:24px;font:500 14px var(--body);color:var(--soft)}
  .map-label b{display:block;font:700 20px var(--title);color:var(--ink);margin-top:4px}
  .town-context{display:flex;gap:32px;padding:22px 0 30px;border-bottom:1px solid var(--line);margin:0 0 44px;color:var(--soft);font-size:13px;flex-wrap:wrap}
  .town-context b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:17px;margin-left:10px;font-weight:600}
  .activities{padding:0 0 32px}
  .activities .section-intro{margin-bottom:28px;max-width:50em}
  .section-intro h2{font-size:clamp(25px,3vw,36px);margin:0 0 10px;line-height:1.4}
  .section-intro p{color:var(--soft);font-size:16px;margin:0;line-height:1.8}
  .activity-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
  .story{border-radius:10px;border:1px solid var(--line);padding:30px;position:relative;min-width:0;background:var(--card);scroll-margin-top:100px}
  .story-open{background:var(--band)}
  .story .story-topic{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:14px;font-weight:700;color:var(--deep)}
  .story-topic i{font-size:24px}
  .story h3{font-size:clamp(25px,2.8vw,34px);line-height:1.42;margin:0 0 16px;letter-spacing:-.035em}

function 붙이기() {
  const 선택 = $('reviewCase');

  document.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    const url = location.href;
    try { if (navigator.share) { await navigator.share({title: document.title, url}); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(url); 알림('동네 화면 주소를 복사했습니다.'); } catch (_) { 알림('주소를 복사하지 못했습니다. 브라우저의 주소를 복사해 주세요.'); }
  });
  document.querySelectorAll('[data-png]').forEach(b => b.onclick = async () => {
    const el = $(b.dataset.png);
    try {
      const url = await htmlToImage.toPng(el, {pixelRatio: 2, backgroundColor: getComputedStyle(el).backgroundColor, fontEmbedCSS: await 제목글꼴()});
      const a = document.createElement('a'); a.href = url; a.download = `${짧은이름(i)}-살림.png`; a.click();
    } catch (e) { 알림('이미지를 만들지 못했습니다. 화면을 캡처해 주세요.'); }
  });
  // 보이는 곳에 들어오면 나타나기(움직임 줄이기 설정이면 그냥 다 보임)
  revealObserver?.disconnect();
  revealObserver = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealObserver.unobserve(e.target); } }), {threshold: .12});
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}
