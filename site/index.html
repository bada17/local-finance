<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지방재정 데이터 나열</title>
<style>
  :root{
    --ground:#FFFFFF; --sunk:#F4F6F8; --line:#C9D2DA; --line-soft:#E3E8ED;
    --ink:#11181F; --muted:#5A6672; --faint:#8A97A3;
    --accent:#1F4E79; --alert:#B03A22;
    --mono:ui-monospace,SFMono-Regular,'Cascadia Mono','DejaVu Sans Mono',monospace;
    --body:system-ui,-apple-system,'Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
      --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
      --accent:#7FB3DC; --alert:#E0755C;
    }
  }
  :root[data-theme="dark"]{
    --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
    --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
    --accent:#7FB3DC; --alert:#E0755C;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 var(--body)}
  .wrap{max-width:1100px; margin:0 auto; padding-inline:16px}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--ground); border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex; align-items:center; gap:8px; min-height:46px; flex-wrap:wrap; padding-block:6px}
  .topbar .t{font-weight:600; font-size:13px}
  .topbar .tolist{margin-right:auto; font-size:12px; color:var(--accent)}
  .grp{display:flex; gap:4px}
  .grp+.grp{margin-left:10px; padding-left:10px; border-left:1px solid var(--line)}
  button{
    font:13px var(--body); color:var(--muted); background:var(--sunk);
    border:1px solid var(--line); padding:5px 11px; cursor:pointer; white-space:nowrap;
  }
  button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  button:disabled{opacity:.4; cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  h1{font-size:20px; margin:22px 0 2px; font-weight:700}
  h1 .cd{color:var(--faint); font-family:var(--mono); font-size:14px; font-weight:400}
  .meta{color:var(--muted); font-size:13px; margin:0}
  .meta span{margin-right:14px}
  .meta b{font-family:var(--mono); color:var(--ink); font-weight:600}

  .basis{
    margin:14px 0 0; padding:10px 12px; background:var(--sunk);
    border:1px solid var(--line); font-size:12.5px; color:var(--muted);
  }
  .basis b{color:var(--ink)}

  h2{font-size:14px; margin:26px 0 2px; font-weight:700; padding-bottom:5px; border-bottom:2px solid var(--ink)}
  h2 small{font-weight:400; color:var(--muted); font-size:12px; margin-left:8px}
  .note{color:var(--faint); font-size:12px; margin:6px 0 8px}
  .note code{font-family:var(--mono); font-size:11.5px; background:var(--sunk); padding:1px 5px; margin-right:3px}
  .note button{font-size:12px; padding:3px 9px; margin-left:4px}

  select{
    font:13px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:5px 8px; max-width:210px;
  }
  select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .srch{margin:10px 0 4px}
  .srch.grp{flex-wrap:wrap; row-gap:5px}
  .srch input{
    font:14px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:7px 10px; width:min(360px,100%);
  }
  .srch input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .scroll{overflow-x:auto; border:1px solid var(--line)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{padding:6px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap}
  thead th{background:var(--sunk); text-align:right; font-weight:600; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  tbody td:first-child{font-family:var(--body); text-align:left}
  tbody td.yr{font-size:11.5px; color:var(--faint); text-align:center}
  tbody tr:hover{background:var(--sunk)}
  tbody tr:last-child td{border-bottom:0}
  tbody td.nm{white-space:normal; max-width:340px; min-width:210px}
  td.mark{color:var(--alert); font-weight:600}
  td.dim{color:var(--faint)}
  .raw{font-size:11px; color:var(--faint); display:block}

  .docs{list-style:none; padding:0; margin:8px 0 0}
  .docs li{padding:5px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
  .docs a{color:var(--accent); font-family:var(--mono); font-size:12px; word-break:break-all}
  .docs b{display:inline-block; min-width:74px; font-weight:600}

  footer{margin:34px 0 40px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:12px}
  footer p{margin:0 0 5px}
  footer code{font-family:var(--mono); font-size:11px; background:var(--sunk); padding:1px 4px}
  footer .call{margin-top:10px; padding-top:9px; border-top:1px solid var(--line-soft); color:var(--ink)}
  footer .call a{color:var(--accent)}
  footer .join{margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  footer .join button, footer .join span{font-size:12px}
  footer .join a{color:var(--accent)}
</style>

<div class="topbar"><div class="wrap">
  <span class="t">지방재정 데이터 나열</span>
  <a class="tolist" href="catalog.html">무슨 자료가 있나 →</a>
  <a class="tolist" href="transparency.html">공시 점검 →</a>
  <span class="grp" id="loc"></span>
  <span class="grp" id="view"></span>
</div></div>

<main class="wrap" id="app"></main>

/* 「…으로/…로」 — 받침을 보고 고른다 */
const 로of = s => {
  const c = s.charCodeAt(s.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return '로';
  const j = c % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
};

const n0 = v => v == null ? '' : Math.round(v).toLocaleString('ko-KR');

function 돈(v){
  if (v == null) return '';
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toLocaleString('ko-KR',{maximumFractionDigits:2}) + '조';
  if (a >= 1e8)  return (v/1e8 ).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '억';
  return n0(v);
}

const 정렬이름 = {'예산': '예산현액순', '지출': '지출순', '집행률낮은': '집행률 낮은 순'};

/* 진행 중인 사업은 눌러서(gzip) 담아 두고 화면이 받아서 푼다 —
   243곳이면 36MB 가 11MB 로 준다. 서버가 이미 풀어 준 경우도 있어 앞 두 글자를 보고 가른다 */
async function 진행데이터(cd){
  if (!(cd in 진행캐시)) {
    try {
      const r = await fetch(`data/ongoing/${cd}.json.gz`);
      if (!r.ok) throw new Error(r.status);
      const buf = await r.arrayBuffer();
      const u8 = new Uint8Array(buf);
      let text;
      if (u8[0] === 0x1f && u8[1] === 0x8b) {
        const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        text = await new Response(s).text();
      } else {
        text = new TextDecoder().decode(buf);
      }
      진행캐시[cd] = JSON.parse(text);
    } catch (e) { 진행캐시[cd] = null; }
  }
  return 진행캐시[cd];
}

const 집행률 = (ep, bdg) => bdg ? ep / bdg * 100 : null;

/* 한 사업은 칸 이름 없이 줄줄이 들어 있다 — 차례는 o.열차례 와 같다.
   [이름, 분야, 부문, 회계, 예산현액, 지출, 국비, 시도비, 시군구비, 기타]
   분야·부문·회계는 o.이름표 의 몇 번째인지만 적혀 있다. 243곳이라 이렇게 줄여야 한다. */
const 이름칸 = 0, 분야칸 = 1, 부문칸 = 2, 회계칸 = 3,
      예산칸 = 4, 지출칸 = 5, 국비칸 = 6, 시도칸 = 7, 시군구칸 = 8, 기타칸 = 9;

function 사업행(x, 표){
  const rt = 집행률(x[지출칸], x[예산칸]);
  const 부문 = 표.부문[x[부문칸]];
  const 돈칸 = i => x[i] ? 돈(x[i]) : '<span class="dim">—</span>';
  return `<tr>
    <td class="nm">${x[이름칸]}</td>
    <td class="dim">${표.분야[x[분야칸]]}${부문 ? ' · ' + 부문 : ''}</td>
    <td class="dim">${표.회계[x[회계칸]]}</td>
    <td>${돈(x[예산칸])}<span class="raw">${n0(x[예산칸])}</span></td>
    <td>${돈(x[지출칸])}<span class="raw">${n0(x[지출칸])}</span></td>
    <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
    <td>${돈칸(국비칸)}</td>
    <td>${돈칸(시도칸)}</td>
    <td>${돈칸(시군구칸)}</td>
    <td>${돈칸(기타칸)}</td>
  </tr>`;
}

function 진행표(o){
  const q = 찾기.trim();
  const 거르기 = 거르개들[재원거르개];
  let 걸린 = o.사업.filter(x => (!q || x[이름칸].includes(q)) && 거르기(x));
  if (사업정렬 !== '예산') 걸린 = [...걸린].sort(정렬들[사업정렬]);
  const 합 = i => 걸린.reduce((s, x) => s + x[i], 0);
  const [bdg, ep, gb, sd, sgg, etc] =
    [예산칸, 지출칸, 국비칸, 시도칸, 시군구칸, 기타칸].map(합);
  const rt = 집행률(ep, bdg);

  const 꾸밈 = [q ? `「${q}」` : '', 재원거르개 === '전부' ? '' :
    ({'국비': '국비가 든 것', '시도비': '시도비가 든 것', '자체': '국비·시도비 없이 제 돈으로만'}[재원거르개])]
    .filter(Boolean).join(' · ');

  const 요약 = `<p class="basis">
    ${꾸밈 ? `<b>${꾸밈}</b> — 걸린 사업 <b>${n0(걸린.length)}</b>개`
           : `<b>${o.연도}년 사업 전부</b> <b>${n0(걸린.length)}</b>개`}
    — 예산현액 <b>${돈(bdg)}</b> · 지출 <b>${돈(ep)}</b>${rt == null ? '' : ` (${n1(rt)}%)`}<br>
    재원 — 국비 <b>${돈(gb)}</b> · 시도비 <b>${돈(sd)}</b> · 시군구비 <b>${돈(sgg)}</b> · 기타 <b>${돈(etc)}</b>
    <span class="dim">(재원은 편성 기준이다. 지출액에는 재원 구분이 붙어 오지 않는다)</span>
  </p>`;

  if (!걸린.length) return 요약 + '<p class="note">걸린 사업이 없다. 글자를 줄여 보라.</p>';

  /* 분야별로 묶어 한 눈에 — 찾는 글자가 없을 때만. 「지금 어디에 쓰고 있나」다 */
  let 분야칸들 = '';
  if (!q && 걸린.length > 30) {
    const 묶 = {};
    걸린.forEach(x => {
      const k = x[분야칸];
      (묶[k] ||= {n: 0, bdg: 0, ep: 0, gb: 0});
      묶[k].n++; 묶[k].bdg += x[예산칸]; 묶[k].ep += x[지출칸]; 묶[k].gb += x[국비칸];
    });
    const 줄 = Object.entries(묶).sort((a, b) => b[1].bdg - a[1].bdg).map(([k, v]) => {
      const rt = 집행률(v.ep, v.bdg);
      return `<tr>
        <td>${o.이름표.분야[k] || '—'}</td>
        <td>${n0(v.n)}</td>
        <td>${돈(v.bdg)}</td>
        <td>${돈(v.ep)}</td>
        <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
        <td>${n1(v.bdg / bdg * 100)}%</td>
        <td>${v.gb ? 돈(v.gb) : '<span class="dim">—</span>'}</td>
      </tr>`;
    });
    분야칸들 = `<h2>분야별<small>지금 어디에 쓰고 있나. 아래 사업들을 분야로 묶은 것이다</small></h2>`
      + table(['분야', '사업수', '예산현액', '지출(누계)', '집행률', '몫', '국비'], 줄);
  }

  const 보임 = 걸린.slice(0, 보일개수);
  const 더 = 걸린.length > 보임.length
    ? `<p class="note">${정렬이름[사업정렬]}으로 ${n0(보임.length)}개만 보인다.
       <button id="more" aria-selected="false">${n0(Math.min(500, 걸린.length - 보임.length))}개 더 보기</button></p>`
    : '';

  return 요약 + 분야칸들
    + (분야칸들 ? `<h2>사업별<small>큰 것부터</small></h2>` : '')
    + table(['세부사업', '분야 · 부문', '회계', '예산현액', '지출(누계)', '집행률', '국비', '시도비', '시군구비', '기타'],
            보임.map(x => 사업행(x, o.이름표))) + 더;
}

function 진행칠하기(o){
  document.getElementById('ongoing').innerHTML = 진행표(o);
  const more = document.getElementById('more');
  if (more) more.onclick = () => { 보일개수 += 500; 진행칠하기(o); };
}

  맞추기();

  const o = await 진행데이터(cd);

  if (!o) {

    app.innerHTML = `<h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
      <p class="basis">${뒤
        ? `이 자치단체는 <b>2026년에 구역이 바뀌었다.</b> 결산·예산 지표는 옛 구역 기준으로 남아 있지만,
           진행 중인 사업은 <b>새 이름으로</b> 올라온다.<br>${뒤}`
        : `이 자치단체의 <b>진행 중인 사업</b> 자료가 아직 없다.
           지방재정365는 단체마다 올리는 시점이 다르다.`}</p>`;
    app.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => {
      지금곳 = b.dataset.go; pick.value = 지금곳; 주소쓰기(); render();
    });
    return;
  }

  const 기준 = `${o.기준.slice(0, 4)}년 ${Number(o.기준.slice(4, 6))}월`;
  app.innerHTML = `
    <h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
    <p class="meta">
      <span>${d.갈래}자치단체</span>
      <span>사업 <b>${n0(o.사업수)}</b>개</span>
      <span>예산현액 <b>${돈(o.예산현액)}</b></span>
      <span>지출 <b>${돈(o.지출)}</b> (${n1(집행률(o.지출, o.예산현액))}%)</span>
      <span>기준 <b>${기준}</b></span>
    </p>
    ${d.새로생김 ? `<p class="basis">⚠️ <b>2026년에 새로 생긴 구역이다.</b>
      결산(2024)·예산(2026) 지표는 옛 구역 기준이라 이 이름으로는 없다. 진행 중인 사업만 볼 수 있다.</p>` : ''}
    <p class="basis"><b>진행 중</b> — 올해 짜 놓은 세부사업과, ${기준}까지 <b>실제로 나간 돈</b>이다.
      결산이 아니라 <b>지금 집행 중인 숫자</b>라 날마다 바뀐다.
      지출액은 그날까지의 <b>누계</b>이며, 출납폐쇄 전이라 뒤에 정리되면서 달라질 수 있다.</p>
    <p class="note">사업 이름으로 찾아보라. 보기 — <code>박람회</code> <code>축제</code> <code>도로</code> <code>보조</code></p>
    <p class="srch"><input id="q" type="search" value="${찾기.replace(/"/g, '&quot;')}"
       placeholder="세부사업 이름에 든 글자" autocomplete="off"></p>
    <p class="srch grp" id="filt">${Object.keys(거르개들).map(k =>
      `<button data-f="${k}" aria-selected="${k === 재원거르개}">${
        ({'전부': '재원 안 가림', '국비': '국비 든 것', '시도비': '시도비 든 것', '자체': '제 돈만'})[k]
      }</button>`).join('')}</p>
    <p class="srch grp" id="sortby">${Object.keys(정렬들).map(k =>
      `<button data-s="${k}" aria-selected="${k === 사업정렬}">${정렬이름[k]}</button>`).join('')}</p>
    <div id="ongoing"></div>
    <footer>
      <p>자료 — 지방재정365 <code>QWGJK</code> 세부사업별 세출현황. ${o.받은날} 에 받았다.</p>
      <p>⚠️ 집행률이 낮다고 게으른 것이 아니다. 하반기에 몰아 쓰는 사업, 준공 뒤 한꺼번에 주는 공사비가 많다.
         20% 밑을 붉게 적어 둔 것은 <b>눈여겨보라</b>는 뜻이지 잘못이라는 뜻이 아니다.</p>
      <p>⚠️ 재원(국비·시도비·시군구비)은 <b>편성</b> 기준이다. 나간 돈을 재원별로 가르는 자료는 따로 없다.</p>
      <p>계약 상대(누가 받아 갔나)는 계약현황(<code>WCEGCF</code>)에 있는데, 사업과 이어 주는 열쇠가 없어
         아직 붙이지 못했다. 계약명 글자를 맞춰 보는 수밖에 없다.</p>
          <p class="join"><button data-join="의견">이 숫자에 의견 남기기</button>
             <button data-join="제보">제보하기</button>
             <span class="dim"></span></p>
          <p class="call">숫자가 틀렸거나 물어볼 것이 있으면 — <b>함께하는 시민행동</b>
         <a href="tel:0229214709">02-921-4709</a> ·
         <a href="mailto:action@action.or.kr">action@action.or.kr</a></p>
</footer>`;

  const q = document.getElementById('q');
  q.addEventListener('input', () => { 찾기 = q.value; 보일개수 = 100; 주소쓰기(); 진행칠하기(o); });

  const 단추칸 = (id, key, 넣기) => document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    넣기(b.dataset[key]); 보일개수 = 100;
    document.querySelectorAll(`#${id} button`).forEach(x =>
      x.setAttribute('aria-selected', String(x === b)));
    진행칠하기(o);
  });
  단추칸('filt', 'f', v => 재원거르개 = v);
  단추칸('sortby', 's', v => 사업정렬 = v);

  진행칠하기(o);
}

function 맞추기(){
  const 진행만 = !!곳맵[지금곳]?.진행만;
  document.querySelectorAll('#view button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.v === 판));
    b.disabled = 진행만 && b.dataset.v !== '진행중';
  });
}

/* 2026년에 구역이 바뀐 곳 — 옛 이름으로는 진행 중인 사업이 안 올라온다 */
const 바뀜 = {
  '2900000': ['6100000'],            // 광주본청 → 전남광주본청
  '4600000': ['6100000'],            // 전남본청 → 전남광주본청
  '2811000': ['2811500', '2812500'], // 인천중구 → 영종구·제물포구
  '2812000': ['2812500'],            // 인천동구 → 제물포구
};

async function render(){
  const cd = 지금곳;
  const app = document.getElementById('app');
  맞추기();

  const d = await 곳데이터(cd);
  if (cd !== 지금곳) return;               // 그 사이 다른 곳을 골랐으면 그만둔다

      <span>${d.갈래}자치단체</span>

      <a href="catalog.html">무슨 자료가 있나</a> ·
      <a href="transparency.html">공시 점검</a></p>
    ${축들}
    <h2>원문<small>지방재정365 가 자치단체별 주소를 API 로 준다</small></h2>

      <p>지금은 <b>${d.결산연도}년 결산</b>과 <b>${d.예산연도}년 예산</b> 두 판만 본다.
         16년치 시계열은 받아 뒀지만(<code>data/series.json</code>) 화면에서는 뺐다 — 나중에 볼 일이다.</p>
      <p>이 화면은 설계를 위한 데이터 나열이다. 꾸미지 않았다.</p>
      <p class="join"><button data-join="의견">이 숫자에 의견 남기기</button>
         <button data-join="제보">제보하기</button>
         <span class="dim"></span></p>
      <p class="call">숫자가 틀렸거나 물어볼 것이 있으면 — <b>함께하는 시민행동</b>
         <a href="tel:0229214709">02-921-4709</a> ·
         <a href="mailto:action@action.or.kr">action@action.or.kr</a></p>
    </footer>`;

  document.querySelectorAll('#view button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.v === 판)));
}

/* 고르개 — 243곳을 시도로 묶는다. 광역 17곳이 맨 위 */
const loc = document.getElementById('loc');
const 시도차례 = [...new Set(INDEX.곳.filter(x => x.갈래 === '기초').map(x => x.시도))];
const 묶음 = [['광역자치단체 17곳', INDEX.곳.filter(x => x.갈래 === '광역')]]
  .concat(시도차례.map(sd => [정식[sd] || sd, INDEX.곳.filter(x => x.갈래 === '기초' && x.시도 === sd)]));
loc.innerHTML = `<select id="pick" aria-label="자치단체 고르기">${
  묶음.map(([label, xs]) => `<optgroup label="${label}">${
    xs.map(x => `<option value="${x.cd}">${이름of(x)}${x.진행만 ? ' — 진행 중인 사업만' : ''}</option>`).join('')
  }</optgroup>`).join('')}</select>`;

const pick = document.getElementById('pick');
pick.value = 지금곳;
pick.addEventListener('change', () => {
  지금곳 = pick.value;
  찾기 = ''; 보일개수 = 100;
  주소쓰기();
  render();
});
addEventListener('hashchange', () => {
  const h = 주소읽기();
  if (h.cd !== 지금곳 || h.판 !== 판 || h.찾기 !== 찾기) {
    지금곳 = h.cd; 판 = h.판; 찾기 = h.찾기; pick.value = h.cd; render();
  }
});

const view = document.getElementById('view');
view.innerHTML = ['결산', '예산', '진행중'].map(v =>
  `<button data-v="${v}" aria-selected="${v === 판}">${v === '진행중' ? '진행 중인 사업' : v + ' 기준'}</button>`).join('');
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  판 = b.dataset.v; 주소쓰기(); render();
});

/* 참여 단추 — 어디에 받아 적을지는 아직 정하지 않았다(2026-09-21).
   자리만 잡아 두고 지금은 메일로 보낸다. 정해지면 이 대목만 갈아끼우면 된다. */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-join]');
  if (!b) return;
  const 무엇 = b.dataset.join;
  const 곳 = b.closest('p').querySelector('span');
  const 어디 = `${이름of(곳맵[지금곳] || {이름: 지금곳})} (${지금곳})`;
  const 제목 = encodeURIComponent(`[지방재정] ${무엇} · ${어디}`);
  곳.innerHTML = '아직 여기서 바로 남기는 칸을 안 만들었다. 지금은 메일로 받는다 — '
    + `<a href="mailto:action@action.or.kr?subject=${제목}">action@action.or.kr 로 ${무엇} 보내기</a>`;
});

render();
</script>
