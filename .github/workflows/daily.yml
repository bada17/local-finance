# 날마다 계약현황과 세부사업별 세출을 받아 저장소에 쌓는다.
#
# ⚠️ 계약(WCEGCF)은 **날짜로만** 뽑힌다. 그날 안 받으면 나중에 소급이 안 되므로
#    이 액션이 이 저장소에서 제일 중요한 자동 일감이다.
# 인증키는 저장소 Secrets 의 LOFIN_KEY 에서 온다(2026-09-21 에 넣었다).
name: 날마다 수집

on:
  schedule:
    - cron: '20 20 * * *'       # UTC 20:20 = 한국 시간 새벽 5시 20분
  workflow_dispatch:
    inputs:
      day:
        description: '받을 날 (YYYYMMDD, 비우면 어제)'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 받기
        env:
          LOFIN_KEY: ${{ secrets.LOFIN_KEY }}
        run: python scripts/collect_daily.py ${{ inputs.day }}

      - name: 못 채운 날 이어 받기
        env:
          LOFIN_KEY: ${{ secrets.LOFIN_KEY }}
        # 지난날이 비어 있으면 하루에 30일씩만 조금씩 메운다.
        # 한 번에 다 받으려 하지 않는다 — 일일 트래픽 제한이 실측되지 않았다.
        run: python scripts/backfill_contracts.py --limit 30

      - name: 올리기
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contracts data/spending
          if git diff --cached --quiet; then
            echo '새로 받은 것이 없다'
          else
            git commit -m "날마다 수집 $(date -u +%Y-%m-%d)"
            git push
          fi
