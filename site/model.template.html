<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지방재정 데이터 나열</title>
<style>
  :root{
    --ground:#FFFFFF; --sunk:#F4F6F8; --line:#C9D2DA; --line-soft:#E3E8ED;
    --ink:#11181F; --muted:#5A6672; --faint:#8A97A3;
    --accent:#1F4E79; --alert:#B03A22;
    --mono:ui-monospace,SFMono-Regular,'Cascadia Mono','DejaVu Sans Mono',monospace;
    --body:system-ui,-apple-system,'Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
      --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
      --accent:#7FB3DC; --alert:#E0755C;
    }
  }
  :root[data-theme="dark"]{
    --ground:#12171C; --sunk:#1A2127; --line:#333C45; --line-soft:#242C34;
    --ink:#E6EBF0; --muted:#98A5B1; --faint:#72808C;
    --accent:#7FB3DC; --alert:#E0755C;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 var(--body)}
  .wrap{max-width:1100px; margin:0 auto; padding-inline:16px}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--ground); border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex; align-items:center; gap:8px; min-height:46px; flex-wrap:wrap; padding-block:6px}
  .topbar .t{font-weight:600; font-size:13px}
  .topbar .tolist{margin-right:auto; font-size:12px; color:var(--accent)}
  .grp{display:flex; gap:4px}
  .grp+.grp{margin-left:10px; padding-left:10px; border-left:1px solid var(--line)}
  button{
    font:13px var(--body); color:var(--muted); background:var(--sunk);
    border:1px solid var(--line); padding:5px 11px; cursor:pointer; white-space:nowrap;
  }
  button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  button:disabled{opacity:.4; cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  h1{font-size:20px; margin:22px 0 2px; font-weight:700}
  h1 .cd{color:var(--faint); font-family:var(--mono); font-size:14px; font-weight:400}
  .meta{color:var(--muted); font-size:13px; margin:0}
  .meta span{margin-right:14px}
  .meta b{font-family:var(--mono); color:var(--ink); font-weight:600}

  .basis{
    margin:14px 0 0; padding:10px 12px; background:var(--sunk);
    border:1px solid var(--line); font-size:12.5px; color:var(--muted);
  }
  .basis b{color:var(--ink)}

  h2{font-size:14px; margin:26px 0 2px; font-weight:700; padding-bottom:5px; border-bottom:2px solid var(--ink)}
  h2 small{font-weight:400; color:var(--muted); font-size:12px; margin-left:8px}
  /* 세입 판 ② — 예산과 결산을 한 칸 안에 나란히 둘 때 쓰는 작은 머리 */
  h3{font-size:13px; margin:16px 0 4px; font-weight:600; color:var(--muted)}
  h3 .yr{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-left:4px}
  .note{color:var(--faint); font-size:12px; margin:6px 0 8px}
  .note code{font-family:var(--mono); font-size:11.5px; background:var(--sunk); padding:1px 5px; margin-right:3px}
  .note button{font-size:12px; padding:3px 9px; margin-left:4px}

  select{
    font:13px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:5px 8px; max-width:210px;
  }
  select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .srch{margin:10px 0 4px}
  .srch.grp{flex-wrap:wrap; row-gap:5px}
  .srch input{
    font:14px var(--body); color:var(--ink); background:var(--sunk);
    border:1px solid var(--line); padding:7px 10px; width:min(360px,100%);
  }
  .srch input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .scroll{overflow-x:auto; border:1px solid var(--line)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{padding:6px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap}
  thead th{background:var(--sunk); text-align:right; font-weight:600; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  tbody td:first-child{font-family:var(--body); text-align:left}
  tbody td.yr{font-size:11.5px; color:var(--faint); text-align:center}
  tbody tr:hover{background:var(--sunk)}
  tbody tr:last-child td{border-bottom:0}
  tbody td.nm{white-space:normal; max-width:340px; min-width:210px}
  td.mark{color:var(--alert); font-weight:600}
  td.dim{color:var(--faint)}
  .raw{font-size:11px; color:var(--faint); display:block}

  /* 세입 판 — 위반 지출 내역은 글이라 줄을 바꿔야 읽힌다 */
  tbody td.long{white-space:normal; max-width:420px; min-width:220px; line-height:1.45}
  /* 재원 구성 띠 — 숫자를 안 읽어도 「제 돈이 얼마나」가 한눈에 보이게 */
  .bar{display:flex; height:16px; border-radius:3px; overflow:hidden; margin:10px 0 12px;
       border:1px solid var(--line-soft)}
  .bar span{display:block; height:100%}

  .docs{list-style:none; padding:0; margin:8px 0 0}
  .docs li{padding:5px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
  .docs a{color:var(--accent); font-family:var(--mono); font-size:12px; word-break:break-all}
  .docs b{display:inline-block; min-width:74px; font-weight:600}

  footer{margin:34px 0 40px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:12px}
  footer p{margin:0 0 5px}
  footer code{font-family:var(--mono); font-size:11px; background:var(--sunk); padding:1px 4px}
  footer .call{margin-top:10px; padding-top:9px; border-top:1px solid var(--line-soft); color:var(--ink)}
  footer .call a{color:var(--accent)}
  footer .join{margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  footer .join button, footer .join span{font-size:12px}
  footer .join a{color:var(--accent)}
</style>

<div class="topbar"><div class="wrap">
  <span class="t">지방재정 데이터 나열</span>
  <a class="tolist" href="catalog.html">무슨 자료가 있나 →</a>
  <a class="tolist" href="transparency.html">공시 점검 →</a>
  <a class="tolist" href="datamap.html">데이터 지도 →</a>
  <span class="grp" id="loc"></span>
  <span class="grp" id="view"></span>
</div></div>

<main class="wrap" id="app"></main>

<script>
/* 243곳의 목록만 화면에 박혀 있고, 고른 곳의 데이터는 그때 받아 온다.
   243곳을 다 담으면 2.3MB 라 페이지가 무거워진다. */
const INDEX = __INDEX__;
const 곳맵 = Object.fromEntries(INDEX.곳.map(x => [x.cd, x]));
const 곳캐시 = {};
async function 곳데이터(cd){
  if (!(cd in 곳캐시)) {
    try {
      const r = await fetch(`data/loc/${cd}.json`);
      곳캐시[cd] = r.ok ? await r.json() : null;
    } catch (e) { 곳캐시[cd] = null; }
  }
  return 곳캐시[cd];
}
/* 주소는 #자치단체코드,판,찾을글자 꼴이다 — 보기: #4612000,진행중,박람회
   한 사례를 그대로 건네줄 수 있어야 해서 찾을 글자까지 넣는다 */
function 주소읽기(){
  const [cd, v, q] = decodeURIComponent(location.hash.slice(1)).split(',');
  return {
    cd: 곳맵[cd] ? cd : (곳맵['2600000'] ? '2600000' : INDEX.곳[0].cd),
    판: ['결산', '예산', '세입', '진행중', '계약'].includes(v) ? v : '결산',
    찾기: q || '',
  };
}
function 주소쓰기(){
  const 뒤 = 판 === '진행중' && 찾기.trim() ? `,진행중,${encodeURIComponent(찾기.trim())}`
           : 판 === '결산' ? '' : `,${판}`;
  history.replaceState(null, '', '#' + 지금곳 + 뒤);
}
const 첫판 = 주소읽기();
let 지금곳 = 첫판.cd;
let 판 = 첫판.판;

const 정식 = {서울:'서울특별시', 부산:'부산광역시', 대구:'대구광역시', 인천:'인천광역시',
  광주:'광주광역시', 대전:'대전광역시', 울산:'울산광역시', 세종:'세종특별자치시',
  경기:'경기도', 강원:'강원특별자치도', 충북:'충청북도', 충남:'충청남도',
  전북:'전북특별자치도', 전남:'전라남도', 경북:'경상북도', 경남:'경상남도', 제주:'제주특별자치도'};
/* 「…으로/…로」 — 받침을 보고 고른다 */
const 로of = s => {
  const c = s.charCodeAt(s.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return '로';
  const j = c % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
};
const 이름of = d => d.진행만 ? d.이름            // 2026년에 바뀐 구역은 온 이름 그대로
  : d.갈래 === '광역' ? (정식[d.시도] || d.이름)
  : (d.이름.startsWith(d.시도) ? d.이름.slice(d.시도.length) : d.이름);

const n0 = v => v == null ? '' : Math.round(v).toLocaleString('ko-KR');
const n1 = v => v == null ? '' : v.toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1});
function 돈(v){
  if (v == null) return '';
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toLocaleString('ko-KR',{maximumFractionDigits:2}) + '조';
  if (a >= 1e8)  return (v/1e8 ).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '억';
  return n0(v);
}

/* 판 가르기 — 결산·실적은 결산 판, 예산 계열은 예산 판 */
const 판of = m => (m.기준 === '결산' || m.기준 === '실적') ? '결산' : '예산';

function table(cols, rows){
  return `<div class="scroll"><table>
    <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

/* 순위·중앙값·최소·최대는 화면에서 뺐다(2026-09-21 사용자 지시) —
   "이런 것은 아직 전혀 필요없어. 지금 해야 하는 건 어떤 것들이 있나".
   데이터에는 그대로 있으니 필요해지면 되살리면 된다. */
function 지표행(m){
  const 천원 = m.단위 === '천원';
  return `<tr>
    <td>${m.이름}</td>
    <td class="yr">${m.기준.replace('예산','')|| '—'}</td>
    <td class="yr">${m.연도}</td>
    ${m.비율 == null ? '<td class="dim">—</td>'
      : `<td>${n1(m.비율)}${천원 ? '' : m.단위}</td>`}
    <td>${천원 ? n0(m.금액) + ' 천원' : 돈(m.금액)}<span class="raw">${n0(m.금액)}</span></td>
  </tr>`;
}

const 축설명 = {
  '규모':       '얼마나 큰 살림인가. 아래 모든 비율의 분모가 되는 수다.',
  '어디서 오나': '제 돈인가 받은 돈인가.',
  '어디에 쓰나': '무엇을 골랐나. 높고 낮음보다 방향을 본다.',
  '새는 곳':     '제대로 쓰나. 값이 큰 쪽 10% 안에 들면 비율과 순위를 붉게 적었다.',
  '빚':         '감당할 수 있나.'
};

const 판설명 = {
  '결산': d => `<b>결산</b> — 이미 쓰고 나서 확정된 실적이다. 숫자가 다시 바뀌지 않는다.
    ${d.결산연도}년이 최신이고 ${Number(d.결산연도)+1}년 결산은 아직 안 올라왔다.
    수의계약비율만 계약 <b>실적</b> 기준이다.`,
  '예산': d => `<b>예산</b> — 아직 쓰기 전의 계획이다. <b>당초</b>는 그 해 처음 짠 것,
    <b>최종</b>은 추경까지 반영된 것. 당초는 ${d.예산연도}년까지 있고 최종은 추경이 끝나야
    나오므로 한 해 늦다. ⚠️ 지방재정365는 <b>1차·2차 추경을 구분해 주지 않는다</b> —
    「최종」 하나뿐이라 몇 차 추경인지는 알 수 없다. 당초/최종 표시가 없는 지표는
    API 가 시점을 밝히지 않은 것이다.`
};

/* ───── 진행 중인 사업 (QWGJK 세부사업별 세출, 일별 누계) ───── */

const 진행캐시 = {};
let 찾기 = 첫판.찾기;
let 보일개수 = 100;
let 재원거르개 = '전부';
let 사업정렬 = '예산';

/* 재원으로 거르기 — 「뭐가 보조금이냐」를 이 칸으로 가른다 */
const 거르개들 = {
  '전부':   () => true,
  '국비':   x => x[국비칸] > 0,
  '시도비': x => x[시도칸] > 0,
  '자체':   x => x[국비칸] === 0 && x[시도칸] === 0,
};
const 정렬들 = {
  '예산': (a, b) => b[예산칸] - a[예산칸],
  '지출': (a, b) => b[지출칸] - a[지출칸],
  '집행률낮은': (a, b) => (집행률(a[지출칸], a[예산칸]) ?? 999) - (집행률(b[지출칸], b[예산칸]) ?? 999),
};
const 정렬이름 = {'예산': '예산현액순', '지출': '지출순', '집행률낮은': '집행률 낮은 순'};

/* 진행 중인 사업은 눌러서(gzip) 담아 두고 화면이 받아서 푼다 —
   243곳이면 36MB 가 11MB 로 준다. 서버가 이미 풀어 준 경우도 있어 앞 두 글자를 보고 가른다 */
async function 진행데이터(cd){
  if (!(cd in 진행캐시)) {
    try {
      const r = await fetch(`data/ongoing/${cd}.json.gz`);
      if (!r.ok) throw new Error(r.status);
      const buf = await r.arrayBuffer();
      const u8 = new Uint8Array(buf);
      let text;
      if (u8[0] === 0x1f && u8[1] === 0x8b) {
        const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        text = await new Response(s).text();
      } else {
        text = new TextDecoder().decode(buf);
      }
      진행캐시[cd] = JSON.parse(text);
    } catch (e) { 진행캐시[cd] = null; }
  }
  return 진행캐시[cd];
}

const 집행률 = (ep, bdg) => bdg ? ep / bdg * 100 : null;

/* 한 사업은 칸 이름 없이 줄줄이 들어 있다 — 차례는 o.열차례 와 같다.
   [이름, 분야, 부문, 회계, 예산현액, 지출, 국비, 시도비, 시군구비, 기타]
   분야·부문·회계는 o.이름표 의 몇 번째인지만 적혀 있다. 243곳이라 이렇게 줄여야 한다. */
const 이름칸 = 0, 분야칸 = 1, 부문칸 = 2, 회계칸 = 3,
      예산칸 = 4, 지출칸 = 5, 국비칸 = 6, 시도칸 = 7, 시군구칸 = 8, 기타칸 = 9;

function 사업행(x, 표){
  const rt = 집행률(x[지출칸], x[예산칸]);
  const 부문 = 표.부문[x[부문칸]];
  const 돈칸 = i => x[i] ? 돈(x[i]) : '<span class="dim">—</span>';
  return `<tr>
    <td class="nm">${x[이름칸]}</td>
    <td class="dim">${표.분야[x[분야칸]]}${부문 ? ' · ' + 부문 : ''}</td>
    <td class="dim">${표.회계[x[회계칸]]}</td>
    <td>${돈(x[예산칸])}<span class="raw">${n0(x[예산칸])}</span></td>
    <td>${돈(x[지출칸])}<span class="raw">${n0(x[지출칸])}</span></td>
    <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
    <td>${돈칸(국비칸)}</td>
    <td>${돈칸(시도칸)}</td>
    <td>${돈칸(시군구칸)}</td>
    <td>${돈칸(기타칸)}</td>
  </tr>`;
}

function 진행표(o){
  const q = 찾기.trim();
  const 거르기 = 거르개들[재원거르개];
  let 걸린 = o.사업.filter(x => (!q || x[이름칸].includes(q)) && 거르기(x));
  if (사업정렬 !== '예산') 걸린 = [...걸린].sort(정렬들[사업정렬]);
  const 합 = i => 걸린.reduce((s, x) => s + x[i], 0);
  const [bdg, ep, gb, sd, sgg, etc] =
    [예산칸, 지출칸, 국비칸, 시도칸, 시군구칸, 기타칸].map(합);
  const rt = 집행률(ep, bdg);

  const 꾸밈 = [q ? `「${q}」` : '', 재원거르개 === '전부' ? '' :
    ({'국비': '국비가 든 것', '시도비': '시도비가 든 것', '자체': '국비·시도비 없이 제 돈으로만'}[재원거르개])]
    .filter(Boolean).join(' · ');

  const 요약 = `<p class="basis">
    ${꾸밈 ? `<b>${꾸밈}</b> — 걸린 사업 <b>${n0(걸린.length)}</b>개`

    — 예산현액 <b>${돈(bdg)}</b> · 지출 <b>${돈(ep)}</b>${rt == null ? '' : ` (${n1(rt)}%)`}<br>
    재원 — 국비 <b>${돈(gb)}</b> · 시도비 <b>${돈(sd)}</b> · 시군구비 <b>${돈(sgg)}</b> · 기타 <b>${돈(etc)}</b>
    <span class="dim">(재원은 편성 기준이다. 지출액에는 재원 구분이 붙어 오지 않는다)</span>
  </p>`;

  if (!걸린.length) return 요약 + '<p class="note">걸린 사업이 없다. 글자를 줄여 보라.</p>';

  /* 분야별로 묶어 한 눈에 — 찾는 글자가 없을 때만. 「지금 어디에 쓰고 있나」다 */
  let 분야칸들 = '';

    걸린.forEach(x => {
      const k = x[분야칸];

      묶[k].n++; 묶[k].bdg += x[예산칸]; 묶[k].ep += x[지출칸]; 묶[k].gb += x[국비칸];
    });
    const 줄 = Object.entries(묶).sort((a, b) => b[1].bdg - a[1].bdg).map(([k, v]) => {
      const rt = 집행률(v.ep, v.bdg);
      return `<tr>
        <td>${o.이름표.분야[k] || '—'}</td>
        <td>${n0(v.n)}</td>
        <td>${돈(v.bdg)}</td>
        <td>${돈(v.ep)}</td>
        <td${rt != null && rt < 20 ? ' class="mark"' : ''}>${rt == null ? '—' : n1(rt) + '%'}</td>
        <td>${n1(v.bdg / bdg * 100)}%</td>
        <td>${v.gb ? 돈(v.gb) : '<span class="dim">—</span>'}</td>
      </tr>`;
    });
    분야칸들 = `<h2>분야별<small>지금 어디에 쓰고 있나. 아래 사업들을 분야로 묶은 것이다</small></h2>`
      + table(['분야', '사업수', '예산현액', '지출(누계)', '집행률', '몫', '국비'], 줄);
  }

  const 보임 = 걸린.slice(0, 보일개수);
  const 더 = 걸린.length > 보임.length
    ? `<p class="note">${정렬이름[사업정렬]}으로 ${n0(보임.length)}개만 보인다.
       <button id="more" aria-selected="false">${n0(Math.min(500, 걸린.length - 보임.length))}개 더 보기</button></p>`
    : '';

  return 요약 + 분야칸들
    + (분야칸들 ? `<h2>사업별<small>큰 것부터</small></h2>` : '')
    + table(['세부사업', '분야 · 부문', '회계', '예산현액', '지출(누계)', '집행률', '국비', '시도비', '시군구비', '기타'],
            보임.map(x => 사업행(x, o.이름표))) + 더;
}

/* ───── ⑥ 누가 받아 갔나 (계약현황 WCEGCF, 3년치를 우리가 센 것) ───── */

const 계약캐시 = {};
/* 처음 열 때 보여줄 해 — 박아 두지 않는다. 받아 둔 마지막 날이 12월 31일이 아니면
   그 해는 반쪽이므로 한 해 앞을 보여준다(자료가 쌓이면 저절로 다음 해로 넘어간다). */
let 계약해 = null;

async function 계약데이터(cd){
  if (!(cd in 계약캐시)) {
    try {
      const r = await fetch(`data/contracts/${cd}.json`);
      계약캐시[cd] = r.ok ? await r.json() : null;
    } catch (e) { 계약캐시[cd] = null; }
  }
  return 계약캐시[cd];
}

function 계약표(y){
  const 총 = y.금액 || 0;
  const 줄 = y.업체.map(([이름, 이름꼴수, 금액, 건수, 수의, 조달청], i) => {
    const 몫 = 총 ? 금액 / 총 * 100 : 0;
    const 수의율 = 금액 ? 수의 / 금액 * 100 : 0;
    return `<tr>
      <td class="yr">${i + 1}</td>
      <td>${조달청
        ? `<span class="dim">${이름}</span> <span class="tag">조달청을 거친 것 — 진짜 업체가 아니다</span>`
        : 이름}${이름꼴수 > 1
        ? ` <span class="dim" title="같은 업체인데 표기가 여러 가지다 — 법인격 표기만 다른 것을 합쳤다">+${이름꼴수 - 1}가지 표기</span>`
        : ''}</td>
      <td>${돈(금액)}<span class="raw">${n0(금액)}</span></td>
      <td>${n1(몫)}%</td>
      <td>${n0(건수)}</td>
      <td>${돈(Math.round(금액 / Math.max(1, 건수)))}</td>
      <td class="${수의율 >= 80 ? 'mark' : ''}">${n1(수의율)}%</td>
    </tr>`;
  });
  return table(['', '업체', '받아 간 금액', '몫', '건수', '건당 평균', '수의계약 몫'], 줄);
}

      <p>⚠️ <b>수의계약이 많다고 잘못이 아니다.</b> 소액이거나 한 곳밖에 없는 물품은 법이 수의를 허용한다.

      <p>⚠️ 원본에 <b>자릿수 오류</b>가 있다. 한 건이 1조원을 넘는 세 줄(임실군 708조 등)은 빼고 셌다.

/* ───── 세입 판 — 돈이 어디서 오나 (data/revenue/<코드>.json) ─────
   쓰는 쪽만 보다가 들어오는 쪽을 폈다. 다섯 칸으로 짠다:
   ① 얼마가 ② 어디서 ③ 걷힌 것과 밀린 것 ④ 깎아 준 돈 ⑤ 상과 벌.
   ⭐ ⑤ 가 머리기사다 — 교부세 감액에는 **감액사유와 위반지출내역이 글로** 들어 있다. */
const 세입캐시 = {};
let 세입색인 = null;

async function 세입자료(cd){
  if (세입캐시[cd] !== undefined) return 세입캐시[cd];
  try {
    const r = await fetch(`data/revenue/${cd}.json`);
    세입캐시[cd] = r.ok ? await r.json() : null;
  } catch { 세입캐시[cd] = null; }
  return 세입캐시[cd];
}

async function 세입가운데(){
  if (세입색인) return 세입색인;
  try {
    const r = await fetch('data/revenue/index.json');
    세입색인 = r.ok ? await r.json() : {가운데:{}, 전국:{}};
  } catch { 세입색인 = {가운데:{}, 전국:{}}; }
  return 세입색인;
}

/* 막대 하나 — 재원 구성을 글자 없이도 읽히게.
   세목은 「시세·취득세」처럼 앞에 임자가 붙는다 — **임자로 색을 나눈다**
   (광역이 걷는 시세·도세 대 이 곳이 걷는 구세·군세). */
function 띠(칸){
  const 임자색 = {'시세':'#2f6f4f','도세':'#2f6f4f','구세':'#b4552d','군세':'#b4552d'};
  const 첫 = 칸[0]?.이름 || '';
  if (첫.includes('·')) {
    return `<div class="bar">${칸.filter(x => x.몫 >= 0.3).map(x => {
      const 임 = x.이름.split('·')[0];
      const c = 임자색[임] || '#8d8d8d';
      return `<span style="width:${x.몫}%;background:${c};opacity:${0.55 + Math.min(x.몫, 40) / 90}"
        title="${x.이름.replace('·', ' · ')} ${x.몫}%"></span>`;
    }).join('')}</div>`;
  }
  const 색 = {'지방세수입':'#2f6f4f','세외수입':'#4e9c78','지방교부세':'#c98a3a',
              '조정교부금및재정보전금':'#d4a857','조정교부금등':'#d4a857','교부금':'#d4a857',
              '보조금':'#b4552d','지방채':'#8a3b3b','지방채및예치금회수':'#8a3b3b',
              '보전수입등및내부거래':'#8d8d8d','지방양여금':'#c98a3a'};
  return `<div class="bar">${칸.filter(x => x.몫 >= 0.2).map(x =>
    `<span style="width:${x.몫}%;background:${색[x.이름] || '#aaa'}"
      title="${x.이름} ${x.몫}%"></span>`).join('')}</div>`;
}

function 세입표(제목, 설명, 속){
  return `<h2>${제목}<small>${설명}</small></h2>${속}`;
}

async function renderRevenue(cd){
  const app = document.getElementById('app');
  app.innerHTML = `<h1>${이름of(곳맵[cd] || {이름: cd})}</h1>
    <p class="note">세입 자료를 받아 오는 중…</p>`;
  const [d, 색인] = await Promise.all([세입자료(cd), 세입가운데()]);
  if (판 !== '세입' || cd !== 지금곳) return;
  if (!d) {
    app.innerHTML = `<h1>${이름of(곳맵[cd] || {이름: cd})}</h1>
      <p class="basis">이 자치단체의 세입 자료가 아직 없다.
      <code>data/revenue/${cd}.json</code> 이 없다.</p>`;
    return;
  }
  const 가 = 색인.가운데 || {};
  const 결 = d.세입결산 || [], 예 = d.세입예산 || [];
  const 끝결 = 결[결.length - 1], 끝예 = 예[예.length - 1];
  const 재 = d.재원, 체 = (d.체납 || [])[d.체납.length - 1];
  const 면 = (d.감면 || [])[d.감면.length - 1];

  /* ① 얼마가 들어오나 */
  const 규모 = table(['구분','연도','총계','일반회계','특별회계·기금'], [
    끝결 ? `<tr><td>세입 결산</td><td class="yr">${끝결.해}</td>
      <td>${돈(끝결.총계)}<span class="raw">${n0(끝결.총계)}</span></td>
      <td>${돈(끝결.일반회계)}</td>
      <td>${돈((끝결.공기업특별||0)+(끝결.기타특별||0)+(끝결.기금||0))}</td></tr>` : '',
    끝예 ? `<tr><td>세입 예산</td><td class="yr">${끝예.해}</td>
      <td>${돈(끝예.총계)}<span class="raw">${n0(끝예.총계)}</span></td>
      <td>${돈(끝예.일반회계)}</td>
      <td>${돈((끝예.공기업특별||0)+(끝예.기타특별||0)+(끝예.기금||0))}</td></tr>` : '',
  ].filter(Boolean));

  /* ② 어디서 오나 — 예산(잡은 것)과 결산(들어온 것)을 나란히 */
  const 예재 = d.재원예산;
  const 한덩이 = (묶, 무엇) => 묶 ? `
    <h3>${무엇} <span class="yr">${묶.해}년</span></h3>
    ${띠(묶.칸)}
    ${table(['재원','금액','몫'], 묶.칸.map(x =>
      `<tr><td>${x.이름}${x.밖에서 === false
          ? ' <b title="밖에서 새로 들어온 돈이 아니다">※</b>' : ''}</td>
       <td>${돈(x.금액)}<span class="raw">${n0(x.금액)}</span></td>
       <td>${n1(x.몫)}%</td></tr>`))}` : `<h3>${무엇}</h3><p class="basis">자료가 없다.</p>`;
  const 구성 = `${한덩이(예재, '예산 — 들어올 것으로 잡은 것')}
    ${한덩이(재, '결산 — 실제로 들어온 것')}
    <p class="basis"><b>예산은 추정이고 결산은 실적이다.</b> 둘을 섞지 않고 나란히 두었다.
      ${재 && 예재 ? `제 돈(지방세+세외수입) 몫이 예산 ${예재.해}년 <b>${n1(예재.제돈몫)}%</b>,
        결산 ${재.해}년 <b>${n1(재.제돈몫)}%</b>다.` : ''}
      전국 가운데값은 ${가.제돈몫 != null ? n1(가.제돈몫) + '%' : '—'}(결산 기준).
      나머지는 위에서 내려온 돈이라 쓸 곳을 스스로 정하기 어렵다.
      ⚠️ 예산은 <b>최종</b>(추경 반영) 기준이라 결산보다 해가 앞선다.</p>
    ${재 && 재.안것몫 ? `<p class="basis">※ <b>「보전수입등및내부거래」는 밖에서 새로 들어온 돈이 아니다.</b>
      작년에 쓰고 남은 돈(순세계잉여금)과 회계끼리 주고받은 돈이다.
      이 곳은 그것이 <b>${n1(재.안것몫)}%</b>(${돈(재.안것)})를 차지한다 —
      그것을 빼고 <b>밖에서 들어온 돈만</b>으로 다시 세면 제 돈 몫은
      ${n1(재.제돈몫)}% 가 아니라 <b>${n1(재.제돈몫_밖에서만)}%</b>다.</p>` : ''}
    <p class="note">⛔ <b>총계 기준이다. 순계로 바꾸지 않는다.</b> 순계는 「제 돈으로 조달한 것」이
      아니라 <b>전국 합계를 두 번 세지 않으려고 받는 쪽에서 위에서 내려준 돈을 지운 것</b>이다 —
      인천 부평구 2024 는 순계로 보면 보조금 7,685억이 121억, 조정교부금 1,476억이 0 이 되어
      제 돈 몫이 15.3%에서 51.3%로 「뛴다」. 자립도가 높아진 게 아니라 분모를 지운 것이다.</p>`;

  /* ③ 무슨 세금인가 — 세목별 */
  const 세 = d.세목;
  const 원 = v => 세?.천원단위 ? (v == null ? v : v * 1000) : v;
  const 세금 = 세 ? `${띠(세.칸)}
    ${table(['세목','징수액','몫'], 세.칸.map(x =>
      `<tr><td>${x.이름.replace('·', ' · ')}</td>

    <p class="basis">${세.해}년 · <b>${세.단위}</b> 기준.
      ${세.이곳것아님
        ? `⚠️ <b>이 자치단체만의 세목별 자료를 못 찾았다.</b> 여기 숫자는

        : `<b>이 자치단체가 실제로 걷은 세금</b>이다.
           앞의 <b>시세·도세</b>는 광역이 걷어 가는 세금이고,
           <b>구세·군세</b>는 이 곳이 제 몫으로 걷는 세금이다 — 같은 땅에서 걷혀도 임자가 다르다.
           ${세.합계 ? `합계 ${돈(세.합계 * 1000)}.` : ''}`}
      ⚠️ <b>API 로는 시·도 17곳까지만 나온다.</b> 이 숫자는 행정안전부
      <b>지방세통계연감</b>(한글 문서)의 「시·도, 시·군·구별 부과징수실적」 표에서 뽑았다.
      연 1회, <b>결산이 끝난 뒤</b> 나오므로 2024년이 가장 최근이다.</p>`
    : '<p class="basis">세목별 자료가 없다.</p>';

  /* ③ 걷힌 것과 밀린 것 */
  const 밀림 = 체 ? `${table(['연도','체납 누계','지방세 체납','세외수입 체납','지방세 징수액 대비'],
    (d.체납 || []).slice(-6).reverse().map(x =>
      `<tr><td class="yr">${x.해}</td><td>${돈(x.누계)}<span class="raw">${n0(x.누계)}</span></td>
       <td>${돈(x.지방세)}</td><td>${돈(x.세외수입)}</td>
       <td>${x.징수대비 == null ? '<span class="dim">—</span>' : n1(x.징수대비) + '%'}</td></tr>`))}
    <p class="basis">체납은 <b>쌓인 총액</b>이지 그 해에 새로 밀린 돈이 아니다.
      맨 오른쪽은 그 해 지방세 징수액에 견준 것 — ${체.징수대비 != null
        ? `이 곳은 ${n1(체.징수대비)}%, 전국 가운데값은 ${가.체납대비 != null ? n1(가.체납대비) + '%' : '—'}`
        : '견줄 징수액이 없는 해다'}.</p>`
    : '<p class="basis">체납 자료가 없다.</p>';

  /* ④ 깎아 준 돈 */
  const 깎음 = 면 ? `${table(['연도','비과세액','감면액','지방세 징수액','비과세·감면율'],

    <p class="basis">걷을 수 있었는데 <b>법으로 안 걷기로 한 돈</b>이다. 낮다고 좋은 것도,

      전국 가운데값은 ${가.감면율 != null ? n1(가.감면율) + '%' : '—'}.</p>`
    : '<p class="basis">비과세·감면 자료가 없다.</p>';

  /* ⑤ 상과 벌 — 머리기사 */
  const 벌 = d.감액 || [];
  const 상벌 = `${벌.length ? `
    <p class="basis"><b>교부세에서 깎인 돈이 ${돈(d.감액합계)}</b>
      (${벌.length}건, ${벌[벌.length-1].해}~${벌[0].해}).
      전국으로는 ${색인.전국?.감액곳 || '—'}곳에서 ${돈(색인.전국?.감액합계)}가 깎였다.</p>
    ${table(['연도','감액','사유','위반 지출 내역'], 벌.slice(0, 20).map(x =>
      `<tr><td class="yr">${x.해}</td>
       <td>${돈(x.금액)}<span class="raw">${n0(x.금액)}</span></td>
       <td>${x.사유 || '<span class="dim">—</span>'}</td>
       <td class="long">${x.내역 || '<span class="dim">—</span>'}</td></tr>`))}
    ${벌.length > 20 ? `<p class="note">최근 20건만 보였다(모두 ${벌.length}건).</p>` : ''}`
    : '<p class="basis">깎인 적이 없다.</p>'}
    ${d.인센티브합계 ? `<p class="basis">거꾸로 인센티브로 받은 돈은
      ${돈(d.인센티브합계)}다(${(d.인센티브||[]).length}개 해).</p>` : ''}`;

  app.innerHTML = `<h1>${이름of(곳맵[cd] || {이름: cd})}</h1>
    <p class="basis"><b>세입</b> — 지금까지 화면은 <b>쓰는 쪽</b>만 보여 줬다.
      이 판은 들어오는 쪽이다. 제 손으로 걷은 돈인지, 위에서 받은 돈인지, 무슨 세금인지,
      걷어야 하는데 못 걷은 돈은 얼마인지, 그리고 <b>잘못 써서 깎인 돈</b>이 있는지를 본다.</p>
    ${세입표('① 얼마가 들어오나', '예산은 들어올 것으로 잡은 것, 결산은 실제로 들어온 것.', 규모)}
    ${세입표('② 어디서 오나', '제 돈인가 받은 돈인가. 예산과 결산을 나란히 두었다.', 구성)}
    ${세입표('③ 무슨 세금인가', '취득세·재산세·주민세… 세목으로 나눈 것.', 세금)}
    ${세입표('④ 걷힌 것과 밀린 것', '걷기로 한 돈 가운데 아직 못 걷은 것.', 밀림)}
    ${세입표('⑤ 깎아 준 돈', '비과세와 감면으로 안 걷은 돈.', 깎음)}
    ${세입표('⑥ 상과 벌', '법령을 어겨 교부세가 깎였나. ⭐ 사유와 위반 내역이 글로 남아 있다.', 상벌)}
    <p class="note">자료 — 지방재정365 세입 계열 43종(<code>data/revenue/</code>).
      ⚠️ 자료마다 있는 해가 다르다. 없는 해는 빈칸으로 두었지 0 으로 채우지 않았다.
      ⚠️ 세목은 시·도 17곳까지만 나온다.</p>`;
}

/* 2026년에 구역이 바뀐 곳 — 옛 이름으로는 진행 중인 사업이 안 올라온다 */
const 바뀜 = {
  '2900000': ['6100000'],            // 광주본청 → 전남광주본청
  '4600000': ['6100000'],            // 전남본청 → 전남광주본청
  '2811000': ['2811500', '2812500'], // 인천중구 → 영종구·제물포구
  '2812000': ['2812500'],            // 인천동구 → 제물포구
};

async function render(){
  const cd = 지금곳;
  const app = document.getElementById('app');
  맞추기();
  // 계약 판은 지표 파일 없이도 선다(곳별 계약 파일만 있으면 된다)
  if (판 === '계약') return renderContracts(cd);
  // 세입 판도 마찬가지 — 제 자료(site/data/revenue/<코드>.json)만 있으면 된다
  if (판 === '세입') return renderRevenue(cd);
  // 2026년에 새로 생긴 구역은 지표(2024 결산·2026 예산)가 아직 없다 — 진행 판만 연다
  const 쪽지 = 곳맵[cd];
  if (쪽지?.진행만) {
    판 = '진행중'; 맞추기();
    return renderOngoing(cd, {laf_cd: cd, 이름: 쪽지.이름, 시도: 쪽지.시도,
                             갈래: 쪽지.갈래, 진행만: 1, 새로생김: true});
  }

  const d = await 곳데이터(cd);
  if (cd !== 지금곳) return;               // 그 사이 다른 곳을 골랐으면 그만둔다
  if (!d) {
    app.innerHTML = `<h1>${곳맵[cd]?.이름 || cd}</h1>
      <p class="basis">이 자치단체의 데이터를 못 읽었다. <code>data/loc/${cd}.json</code> 이 없다.</p>`;
    return;
  }
  if (판 === '진행중') return renderOngoing(cd, d);
  const 지표 = d.지표.filter(m => 판of(m) === 판);

  const byAxis = {};
  지표.forEach(m => (byAxis[m.축] ||= []).push(m));
  const 축들 = Object.keys(byAxis).map((axis, i) => `
    <h2>${'①②③④⑤⑥'[i] || ''} ${axis}<small>${축설명[axis] || ''}</small></h2>
    ${table(['지표','구분','연도','비율','금액'],
            byAxis[axis].map(지표행))}`).join('');

  const docs = Object.entries(d.원문).map(([k, u]) =>
    `<li><b>${k}</b> <a href="${u}" target="_blank" rel="noopener">${u}</a></li>`).join('');

  document.getElementById('app').innerHTML = `
    <h1>${이름of(d)} <span class="cd">${d.laf_cd}</span></h1>
    <p class="meta">
      <span>${d.갈래}자치단체</span>
      <span>인구 <b>${n0(d.인구)}</b>명</span>
      <span>이 판의 지표 <b>${지표.length}</b>종</span>
    </p>
    <p class="basis">${판설명[판](d)}</p>
    <p class="note">순위·중앙값 같은 견줌은 화면에서 뺐다. 지금은 <b>무엇이 있는지</b>부터 본다 —
      <a href="catalog.html">무슨 자료가 있나</a> ·
      <a href="transparency.html">공시 점검</a> ·
      <a href="datamap.html">데이터 지도</a></p>
    ${축들}
    <h2>원문<small>지방재정365 가 자치단체별 주소를 API 로 준다</small></h2>
    <ul class="docs">${docs}</ul>
    <footer>
      <p>자료 — 지방재정365 OpenAPI. 결산 ${d.결산연도}년, 예산 ${d.예산연도}년 기준. 243개 자치단체 전수.</p>
      <p>금액은 조·억으로 줄여 적고 아래에 원 단위를 그대로 붙였다. 1인당 지표만 천원 단위다.</p>
      <p>비율 지표는 분자·분모 금액이 같은 응답에 들어 있다. 비율만 보면 그것이 몇 억인지 알 수 없다.</p>
      <p>갱신 — 결산 시즌에 한 번, 예산 확정 뒤에 한 번.
         <code>python scripts/fetch_indicators.py ${d.결산연도} ${d.예산연도}</code></p>
      <p>지금은 <b>${d.결산연도}년 결산</b>과 <b>${d.예산연도}년 예산</b> 두 판만 본다.
         16년치 시계열은 받아 뒀지만(<code>data/series.json</code>) 화면에서는 뺐다 — 나중에 볼 일이다.</p>
      <p>이 화면은 설계를 위한 데이터 나열이다. 꾸미지 않았다.</p>
      <p class="join"><button data-join="의견">이 숫자에 의견 남기기</button>
         <button data-join="제보">제보하기</button>
         <span class="dim"></span></p>
      <p class="call">숫자가 틀렸거나 물어볼 것이 있으면 — <b>함께하는 시민행동</b>
         <a href="tel:0229214709">02-921-4709</a> ·
         <a href="mailto:action@action.or.kr">action@action.or.kr</a></p>
    </footer>`;

  document.querySelectorAll('#view button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.v === 판)));
}

/* 고르개 — 243곳을 시도로 묶는다. 광역 17곳이 맨 위 */
const loc = document.getElementById('loc');
const 시도차례 = [...new Set(INDEX.곳.filter(x => x.갈래 === '기초').map(x => x.시도))];
const 묶음 = [['광역자치단체 17곳', INDEX.곳.filter(x => x.갈래 === '광역')]]
  .concat(시도차례.map(sd => [정식[sd] || sd, INDEX.곳.filter(x => x.갈래 === '기초' && x.시도 === sd)]));
loc.innerHTML = `<select id="pick" aria-label="자치단체 고르기">${
  묶음.map(([label, xs]) => `<optgroup label="${label}">${
    xs.map(x => `<option value="${x.cd}">${이름of(x)}${x.진행만 ? ' — 진행 중인 사업만' : ''}</option>`).join('')
  }</optgroup>`).join('')}</select>`;

const pick = document.getElementById('pick');
pick.value = 지금곳;
pick.addEventListener('change', () => {
  지금곳 = pick.value;
  찾기 = ''; 보일개수 = 100;
  주소쓰기();
  render();
});
addEventListener('hashchange', () => {
  const h = 주소읽기();
  if (h.cd !== 지금곳 || h.판 !== 판 || h.찾기 !== 찾기) {
    지금곳 = h.cd; 판 = h.판; 찾기 = h.찾기; pick.value = h.cd; render();
  }
});

const view = document.getElementById('view');
const 판이름 = {'세입': '세입', '진행중': '진행 중인 사업', '계약': '누가 받아 갔나'};
view.innerHTML = ['결산', '예산', '세입', '진행중', '계약'].map(v =>
  `<button data-v="${v}" aria-selected="${v === 판}">${판이름[v] || v + ' 기준'}</button>`).join('');
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  판 = b.dataset.v; 주소쓰기(); render();
});

/* 참여 단추 — 어디에 받아 적을지는 아직 정하지 않았다(2026-09-21).
   자리만 잡아 두고 지금은 메일로 보낸다. 정해지면 이 대목만 갈아끼우면 된다. */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-join]');
  if (!b) return;
  const 무엇 = b.dataset.join;
  const 곳 = b.closest('p').querySelector('span');
  const 어디 = `${이름of(곳맵[지금곳] || {이름: 지금곳})} (${지금곳})`;
  const 제목 = encodeURIComponent(`[지방재정] ${무엇} · ${어디}`);
  곳.innerHTML = '아직 여기서 바로 남기는 칸을 안 만들었다. 지금은 메일로 받는다 — '
    + `<a href="mailto:action@action.or.kr?subject=${제목}">action@action.or.kr 로 ${무엇} 보내기</a>`;
});

render();
</script>
